"United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Computer scientist, UCLA", "dom": ["phil"], "url": "", "host": "", "mono": "JP", "meta": [["Lifespan", "b. 1936"], ["Era", "Contemporary"], ["Based", "Los Angeles, United States"]], "sec": [], "b": "Formalised causal inference — the do-calculus, structural causal models, the ladder of causation from association to intervention to counterfactuals — and has argued for decades that pure curve-fitting cannot answer causal questions however much data it has.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Causality: Models, Reasoning, and Inference (2000)", "u": null}, {"t": "The Book of Why (2018)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Causal inference, and the difference between prediction and explanation.", "zr": "Arguably the most operationally important thinker here after Popper. Whether a change in sensor readings was caused by deterioration or by traffic composition is a causal question, and no amount of correlation on the B-WIM archive answers it. Pearl provides the formal machinery that does.", "sc": 2, "ct": [null, null], "era": "Contemporary", "life": "b. 1936", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-russell", "n": "Stuart Russell", "city": "Berkeley", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Professor of Computer Science, UC Berkeley", "dom": ["phil"], "url": "", "host": "", "mono": "SR", "meta": [["Lifespan", "b. 1962"], ["Era", "Contemporary"], ["Based", "Berkeley, United States"]], "sec": [], "b": "Co-author of the standard AI textbook, and latterly the proponent of a redefinition: systems should be built to be uncertain about human objectives rather than to optimise a fixed one.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Human Compatible (2019)", "u": null}, {"t": "Artificial Intelligence: A Modern Approach (with Peter Norvig)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Objective specification, and designing systems that defer rather than optimise.", "zr": "The specification problem is concrete here: a model optimised to minimise weighing error will happily discard the rare heavy-vehicle events that enforcement exists to catch.", "sc": 2, "ct": [null, null], "era": "Contemporary", "life": "b. 1962", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-gebru", "n": "Timnit Gebru", "city": "Distributed", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Founder, Distributed AI Research Institute", "dom": ["phil"], "url": "", "host": "", "mono": "TG", "meta": [["Lifespan", "b. 1983"], ["Era", "Contemporary"], ["Based", "Distributed, United States"]], "sec": [], "b": "Co-author of the stochastic parrots paper, which argued that ever-larger language models carry environmental, financial and representational costs that are rarely accounted for, and whose publication precipitated her departure from Google. Founded DAIR in 2021.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "On the Dangers of Stochastic Parrots (2021, with Bender, McMillan-Major and Mitchell)", "u": null}, {"t": "Datasheets for Datasets (2018)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Dataset documentation, model auditing, and the costs of scale.", "zr": "Datasheets for Datasets is directly adoptable. A B-WIM archive used to train an enforcement model needs exactly that kind of documented provenance, collection conditions and known limitations if the result is ever contested.", "sc": 2, "ct": [null, null], "era": "Contemporary", "life": "b. 1983", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-crawford", "n": "Kate Crawford", "city": "Los Angeles", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Research professor, USC Annenberg", "dom": ["phil"], "url": "", "host": "", "mono": "KC", "meta": [["Lifespan", "b. 1975"], ["Era", "Contemporary"], ["Based", "Los Angeles, United States"]], "sec": [], "b": "Atlas of AI traces AI's material substrate — minerals, energy, water, labour — arguing it is neither artificial nor intelligent but an extractive industry with a computational interface.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Atlas of AI (2021)", "u": null}, {"t": "Anatomy of an AI System (2018, with Vladan Joler)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "The material and environmental economics of AI infrastructure.", "zr": "Relevant to the sustainable built environment side: an AI Factory is a building with a cooling load and an embodied-carbon figure, and that is squarely within ZAG's competence to assess.", "sc": 2, "ct": [null, null], "era": "Contemporary", "life": "b. 1975", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-bender", "n": "Emily M. Bender", "city": "Seattle", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Professor of Linguistics, University of Washington", "dom": ["phil"], "url": "", "host": "", "mono": "EM", "meta": [["Lifespan", "b. 1973"], ["Era", "Contemporary"], ["Based", "Seattle, United States"]], "sec": [], "b": "Argues that language models manipulate form without access to meaning, since meaning requires communicative intent that a text-trained system has no route to. Co-author of the stochastic parrots paper.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "On the Dangers of Stochastic Parrots (2021)", "u": null}, {"t": "Climbing towards NLU: On Meaning, Form, and Understanding (2020)", "u": null}, {"t": "The AI Con (2025, with Alex Hanna)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "What language models do and do not do with meaning.", "zr": "The practical upshot for document processing over standards and reports: use these systems for retrieval and drafting, never as an authority on what a clause requires.", "sc": 2, "ct": [null, null], "era": "Contemporary", "life": "b. 1973", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-oneil", "n": "Cathy O'Neil", "city": "New York", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Mathematician and auditor", "dom": ["phil"], "url": "", "host": "", "mono": "CO", "meta": [["Lifespan", "b. 1972"], ["Era", "Contemporary"], ["Based", "New York, United States"]], "sec": [], "b": "Coined weapons of math destruction for models that are opaque, operate at scale, and produce damaging feedback loops. Now runs an algorithmic auditing firm.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Weapons of Math Destruction (2016)", "u": null}, {"t": "The Shame Machine (2022)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Algorithmic auditing and feedback effects in deployed scoring systems.", "zr": "An enforcement model that targets inspections creates its own training data. That feedback loop is her central case, and it applies directly to any risk-ranking of a bridge stock.", "sc": 2, "ct": [null, null], "era": "Contemporary", "life": "b. 1972", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-lazar", "n": "Seth Lazar", "city": "Canberra", "cn": "Australia", "iso": "au", "x": null, "y": null, "L": "thinker", "ll": "Professor of Philosophy, Australian National University", "dom": ["phil"], "url": "", "host": "", "mono": "SL", "meta": [["Lifespan", "b. 1983"], ["Era", "Contemporary"], ["Based", "Canberra, Australia"]], "sec": [], "b": "Leads the Machine Intelligence and Normative Theory Lab, working on the political philosophy of AI: legitimacy, authority and what justifies an algorithmic system exercising power over people.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Governing the Algorithmic City (2024 Tanner Lectures)", "u": null}, {"t": "Legitimacy, Authority, and the Political Value of Explanations (2022)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Political legitimacy of automated decisions, and what explanation is actually owed.", "zr": "His account of what an explanation owes its subject is the right standard for an AI-derived overload penalty: the driver is entitled to a reason, not a confidence score.", "sc": 2, "ct": [null, null], "era": "Contemporary", "life": "b. 1983", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-wachter", "n": "Sandra Wachter", "city": "Oxford", "cn": "United Kingdom", "iso": "gb", "x": 240.5, "y": 457.2, "L": "thinker", "ll": "Professor of Technology and Regulation, Oxford Internet Institute", "dom": ["phil"], "url": "https://www.oii.ox.ac.uk/people/profiles/sandra-wachter/", "host": "oii.ox.ac.uk", "mono": "SW", "meta": [["Lifespan", "b. 1983"], ["Era", "Contemporary"], ["Based", "Oxford, United Kingdom"]], "sec": [], "b": "Leads the Governance of Emerging Technologies programme at the Oxford Internet Institute and holds a Humboldt Professorship at the Hasso Plattner Institute. Roughly 24,800 citations. Her central contribution is legal-technical rather than abstract: showing that the GDPR does not in fact contain a right to explanation of automated decisions, and then proposing counterfactual explanations as a mechanism that would work without opening the black box. More recently she has argued that the real problem with language models is not hallucination but careless speech.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Counterfactual Explanations without Opening the Black Box: Automated Decisions and the GDPR (with Mittelstadt and Russell)", "u": null}, {"t": "Why a Right to Explanation of Automated Decision-Making Does Not Exist in the GDPR (2017)", "u": null}, {"t": "Bias Preservation in Machine Learning (with Mittelstadt and Russell)", "u": null}, {"t": "Do large language models have a legal duty to tell the truth? (2024, with Mittelstadt)", "u": null}, {"t": "The Fallacy of Sustainable Generative AI: Limitations in EU Environmental Regulation of Data Centres and Paths Forward (2026)", "u": null}], "est": null, "hist": null, "fut": null, "news": [{"d": "2026", "t": "Publishes on the limits of EU environmental regulation of data centres.", "u": "https://www.oii.ox.ac.uk/people/profiles/sandra-wachter/"}, {"d": "2024", "t": "Argues that large language models may carry a legal duty to tell the truth.", "u": "https://www.oii.ox.ac.uk/people/profiles/sandra-wachter/"}], "snip": "Algorithmic accountability, explanation duties in EU law, and the regulation of automated decisions.", "zr": "The most operationally useful contemporary thinker on this list for ZAG. If a B-WIM result ever produces an overload penalty, the driver is legally owed something — and Wachter's counterfactual explanation is the mechanism that supplies it without requiring the model to be interpretable: what would the axle load have had to be for the outcome to differ. Her 2026 work on the limits of EU environmental regulation of data centres is also directly relevant to assessing an AI Factory as a building.", "sc": 3, "ct": [null, null], "era": "Contemporary", "life": "b. 1983", "ox": 0.0, "oy": 18.8, "cc": "UK"}, {"id": "ph-mittelstadt", "n": "Brent Mittelstadt", "city": "Oxford", "cn": "United Kingdom", "iso": "gb", "x": 240.4, "y": 457.2, "L": "thinker", "ll": "Professor of Data Ethics and Policy; Director of Research, Oxford Internet Institute", "dom": ["phil"], "url": "https://www.oii.ox.ac.uk/research/projects/governance-of-emerging-technologies/", "host": "oii.ox.ac.uk", "mono": "BM", "meta": [["Lifespan", "b. 1986"], ["Era", "Contemporary"], ["Based", "Oxford, United Kingdom"]], "sec": [], "b": "A data ethicist and philosopher who founded the Governance of Emerging Technologies programme and is a principal investigator at the Weizenbaum Institute. His 2016 paper mapping the ethics of algorithms remains the standard taxonomy of the field, distinguishing inconclusive, inscrutable and misguided evidence from unfair outcomes and transformative effects.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "The Ethics of Algorithms: Mapping the Debate (2016)", "u": null}, {"t": "Explaining Explanations in AI (FAT* 2019, with Russell and Wachter)", "u": null}, {"t": "Principles alone cannot guarantee ethical AI (2019)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Ethics of algorithms, the limits of principle-based AI governance, and what explanation actually means.", "zr": "His taxonomy is a practical checklist. Applied to BrAId: is the evidence inconclusive (statistical uncertainty), inscrutable (opaque model), or misguided (bad training data)? Those are three different problems requiring three different answers, and conflating them is how monitoring projects lose regulatory arguments.", "sc": 3, "ct": [null, null], "era": "Contemporary", "life": "b. 1986", "ox": -18.8, "oy": 0.0, "cc": "UK"}, {"id": "ph-birhane", "n": "Abeba Birhane", "city": "Dublin", "cn": "Ireland", "iso": "ie", "x": 180.5, "y": 409.5, "L": "thinker", "ll": "Founder, AI Accountability Lab, Trinity College Dublin", "dom": ["phil"], "url": "https://www.tcd.ie/scss/people/academic-staff/birhanea/", "host": "tcd.ie", "mono": "AB", "meta": [["Lifespan", "b. 1988"], ["Era", "Contemporary"], ["Based", "Dublin, Ireland"]], "sec": [], "b": "Established the AI Accountability Lab at Trinity College Dublin in 2024. Her work is empirical rather than speculative: auditing the actual contents of the large image-text datasets that underpin multimodal models, and showing how classification error rates worsen as datasets scale. A cognitive scientist by training, she argues for a relational rather than individualist account of ethics.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "SoK: AI Auditing: The Broken Bus on the Road to AI Accountability (IEEE SaTML, 2024)", "u": null}, {"t": "The Dark Side of Dataset Scaling: Evaluating Racial Classification in Multimodal Models (FAccT, 2024)", "u": null}, {"t": "Large models of what? Mistaking engineering achievements for human linguistic agency (Language Sciences, 2024)", "u": null}, {"t": "The reanimation of pseudoscience in machine learning and its ethical repercussions (Patterns, 2024)", "u": null}, {"t": "Debunking robot rights metaphysically, ethically, and legally (First Monday, 2024)", "u": null}], "est": null, "hist": null, "fut": null, "news": [{"d": "2024", "t": "Establishes the AI Accountability Lab at Trinity College Dublin.", "u": "https://www.tcd.ie/scss/people/academic-staff/birhanea/"}], "snip": "Dataset auditing, the practice and failure of AI accountability, and relational ethics.", "zr": "The auditing work is the transferable part. Her survey of why AI auditing keeps failing — no standards, no access, no consequences — is exactly the terrain a notified body operates in, and reads as a specification for what a credible audit regime would need. Her point that dataset problems get worse rather than better with scale is also a caution against assuming a larger B-WIM archive automatically means a better model.", "sc": 3, "ct": [null, null], "era": "Contemporary", "life": "b. 1988", "ox": -14.4, "oy": 8.3, "cc": "IE"}, {"id": "ph-mitchell", "n": "Melanie Mitchell", "city": "Santa Fe", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Davis Professor of Complexity, Santa Fe Institute", "dom": ["phil"], "url": "", "host": "", "mono": "MM", "meta": [["Lifespan", "b. 1969"], ["Era", "Contemporary"], ["Based", "Santa Fe, United States"]], "sec": [], "b": "Works on conceptual abstraction and analogy-making, and is among the most careful public sceptics about claims that current systems understand anything. Her position is not that machines cannot think but that the field consistently mistakes benchmark performance for comprehension, and lacks the evaluation methods to tell the difference.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Artificial Intelligence: A Guide for Thinking Humans (2019)", "u": null}, {"t": "Complexity: A Guided Tour (2009)", "u": null}, {"t": "Abstraction and analogy-making in artificial intelligence (2021)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Analogy, abstraction, and the evaluation of machine understanding.", "zr": "Her recurring argument — that a system passing a benchmark may be exploiting shortcuts rather than grasping the task — is the right scepticism to bring to a model that weighs vehicles accurately on the validation set. The question is always whether it learned the physics or the dataset.", "sc": 2, "ct": [null, null], "era": "Contemporary", "life": "b. 1969", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-narayanan", "n": "Arvind Narayanan & Sayash Kapoor", "city": "Princeton", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Computer scientists, Princeton University", "dom": ["phil"], "url": "", "host": "", "mono": "AN", "meta": [["Lifespan", "AI Snake Oil, 2024"], ["Era", "Contemporary"], ["Based", "Princeton, United States"]], "sec": [], "b": "Their central move is to refuse to treat AI as one thing. They separate generative AI, which works and has real problems, from predictive AI applied to social outcomes, which they argue largely does not work and is sold anyway. The book documents failures in hiring, criminal justice and civil-service prediction systems.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "AI Snake Oil: What Artificial Intelligence Can Do, What It Can't, and How to Tell the Difference (2024)", "u": null}, {"t": "Leakage and the reproducibility crisis in machine-learning-based science (Patterns, 2023)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Distinguishing capability from marketing, and reproducibility failures in applied machine learning.", "zr": "The leakage paper is the one to read before publishing anything. It documents how easily train-test contamination inflates reported accuracy in applied ML across dozens of fields — the single most common way a monitoring model looks better in a paper than on a bridge. Their test for AI snake oil is also a usable procurement filter.", "sc": 2, "ct": [null, null], "era": "Contemporary", "life": "AI Snake Oil, 2024", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-bengio", "n": "Yoshua Bengio", "city": "Montreal", "cn": "Canada", "iso": "ca", "x": null, "y": null, "L": "thinker", "ll": "Professor, Université de Montréal; founder of Mila", "dom": ["phil"], "url": "", "host": "", "mono": "YB", "meta": [["Lifespan", "b. 1964"], ["Era", "Contemporary"], ["Based", "Montreal, Canada"]], "sec": [], "b": "One of the architects of modern deep learning and a Turing Award laureate, who since 2023 has become one of its most prominent internal critics. He chaired the International AI Safety Report, the first attempt at an IPCC-style scientific consensus assessment of AI risks, backed by around thirty countries.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Deep Learning (2016, with Goodfellow and Courville)", "u": null}, {"t": "International AI Safety Report (2025), as chair", "u": null}, {"t": "Foundational work on neural language models and attention", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Deep learning foundations, and scientific consensus-building on AI risk.", "zr": "Peripheral to bridges, but the International AI Safety Report is the closest thing to an authoritative reference document if ZAG ever needs to cite something on AI risk in a funding application or a governance annex. Bengio's own trajectory — from building the methods to arguing for restraint — is also worth knowing when weighing enthusiastic claims from vendors.", "sc": 2, "ct": [null, null], "era": "Contemporary", "life": "b. 1964", "ox": 0, "oy": 0, "cc": ""}], "rank": [{"n": 1, "t": "Tübingen – Stuttgart", "k": "Germany", "ids": ["tue", "aif-hammerhai", "ipa"], "w": "Europe's deepest bench in fundamental machine learning, and the only one with an endowment behind it — €100m from the Hector Foundation over ten years plus €25m from Baden-Württemberg. Almost every principal investigator at the ELLIS Institute is jointly appointed at MPI-IS or the Tübingen AI Center, so recruitment and supervision draw on one pool rather than three competing ones. Fraunhofer IPA and HammerHAI put applied manufacturing AI in the same region.", "c": "Compute. Nothing in Baden-Württemberg matches Alps or JUPITER, and HammerHAI is deliberately scoped at engineering and manufacturing."}, {"n": 2, "t": "Zurich – Lausanne – Lugano", "k": "Switzerland", "ids": ["zrh", "epfl", "cscs", "eth-smm", "epfl-imos", "empa"], "w": "The only European cluster that owns every layer of the stack and has shipped proof of it: research groups at ETH and EPFL, a dedicated national machine at CSCS with roughly 11,000 GH200 superchips, and Apertus, a fully open 70B model now at version 1.5. It is also the strongest cluster for engineering AI specifically — ETH's Structural Mechanics and Monitoring chair, EPFL's maintenance and operations group, and Empa's structural laboratories are all here.", "c": "Switzerland sits outside the EU's funding and compute instruments, so no AI Factory or Gigafactory money reaches it."}, {"n": 3, "t": "London – Oxford – Cambridge – Sheffield", "k": "United Kingdom", "ids": ["dm", "ati", "ucl", "oxf", "cam", "csic-cam", "shef-drg"], "w": "Google DeepMind alone outweighs most national programmes on published output and deployed systems. For infrastructure specifically the UK is arguably first in Europe: Sheffield's Dynamics Research Group originated population-based SHM and holds a £7.7m EPSRC programme grant on it, and Cambridge's CSIC is an Innovation and Knowledge Centre built to move sensing methods into industry standards.", "c": "The public half is unsettled. The Alan Turing Institute was told in July 2025 to reorient around defence or lose core funding and cut its portfolio by about 80%. The UK is also outside EuroHPC."}, {"n": 4, "t": "Paris – Saclay", "k": "France", "ids": ["inria", "mistral", "fair", "psl", "aif-ai2f", "hpc-alice", "ugev"], "w": "The only European metro area holding an independent frontier-model company, several corporate research laboratories, a national research institute and an AI Factory beside an exascale machine. Université Gustave Eiffel adds the national transport-infrastructure research role. Île-de-France counts more than 12,000 startups and about 85% of French R&D employment.", "c": "Mistral's capital requirements against far larger US competitors, and whether Alice Recoque lands on schedule."}, {"n": 5, "t": "Amsterdam – Delft", "k": "Netherlands", "ids": ["ams", "aif-nlaif", "delft", "tno"], "w": "Unusual methodological depth for its size — variational and geometric deep learning, causality — in one science park alongside CWI, an ELLIS unit and Qualcomm's European research group, with Delft and TNO supplying the engineering and applied side. NLAIF, selected October 2025, closes the compute gap that used to be the obvious objection.", "c": "No frontier-scale training capacity yet, and NLAIF's site has not been announced."}], "sources": [["EuroHPC JU — AI Factory selections", "All three rounds: 10 December 2024, 12 March 2025 and 10 October 2025.", "https://www.eurohpc-ju.europa.eu/eurohpc-ju-selects-six-additional-ai-factories-expand-europes-ai-capabilities-2025-10-10_en"], ["EuroHPC JU — Our Supercomputers", "Specifications and June 2026 TOP500 and Green500 positions for all 12 systems.", "https://www.eurohpc-ju.europa.eu/supercomputers/our-supercomputers_en"], ["ZAG", "Institutional pages, the 2024 ARIS project announcement including BrAId (J7-50096), and the EXCITE2 facility record.", "https://www.zag.si/en/"], ["ETH Zurich — Structural Mechanics and Monitoring", "Group pages, project list and publication record.", "https://chatzi.ibk.ethz.ch"], ["University of Sheffield — Dynamics Research Group", "Group pages plus indexed publication records.", "https://drg.ac.uk"], ["Cambridge CSIC", "Centre pages and the bridge digital twin study with the Alan Turing Institute.", "https://www-smartinfrastructure.eng.cam.ac.uk"], ["RWTH Aachen WZL", "Announcements on Skipro, AKIMI and the Athenyx spin-off, 2026.", "https://www.wzl.rwth-aachen.de"], ["ELLIS", "Network structure and unit announcements, including the seven added 18 May 2026.", "https://ellis.eu"], ["Swiss AI Initiative — Apertus", "Apertus 1.0, 1.5 and Mini.", "https://www.apertus-ai.org"], ["flag-icons (lipis), MIT licence", "Country flags are embedded from this open set. Spain and Croatia are simplified to keep the file small.", "https://github.com/lipis/flag-icons"], ["Eurostat / GISCO via Nuts2json", "Official EU boundaries, NUTS level 0 at 1:10M in EPSG:3035, including the graticule.", "https://github.com/eurostat/Nuts2json"], ["BASt", "Renaming (Feb 2025), the Bridge Competence Centre (Aug 2025), the D-A-CH 2026 call and the AIrBSound project.", "https://www.bast.de"], ["UCD School of Civil Engineering", "Eugene J. OBrien’s publication record, including the 2025 PINN algorithm for bridge weigh-in-motion.", "https://www.ucd.ie/civileng/"], ["BAM Divisions 7.2 and 8.2", "The Nibelungen Bridge living lab, the openLAB open dataset and the German road-bridge monitoring guideline.", "https://www.bam.de"], ["UL FGG", "Faculty research programmes, chairs and their leaders.", "https://www.en.fgg.uni-lj.si/"], ["Empa Lab 303", "Laboratory pages: accreditation, Fe-SMA, mixed-mode fatigue and the SMAR conference series.", "https://www.empa.ch/web/s303"], ["Université Gustave Eiffel — MAST", "Department and laboratory pages for LAMES and SMC, including test facilities.", "https://mast.univ-gustave-eiffel.fr/"], ["Oxford Internet Institute", "Sandra Wachter and Brent Mittelstadt: profiles, the GET programme and publication lists.", "https://www.oii.ox.ac.uk/research/projects/governance-of-emerging-technologies/"], ["Trinity College Dublin", "Abeba Birhane’s publication record and the AI Accountability Lab.", "https://www.tcd.ie/scss/people/academic-staff/birhanea/"], ["TÜBİTAK", "BILGEM, UEKAE and the Gebze campus; Türkiye’s partnership in the BSC AI Factory consortium.", "https://bilgem.tubitak.gov.tr/en"], ["Koç University", "The KUIS AI Center, established February 2020 with İş Bankası.", "https://ai.ku.edu.tr"], ["BRIDGITISE", "Project site, ZAG’s project pages and the CORDIS record (project 101119554) for the network, its clusters and the DC4 and DC7 positions.", "https://www.bridgitise.polimi.it/"], ["CORDIS", "The authoritative register of EU-funded research projects, for anything this map does not cover.", "https://cordis.europa.eu"]], "zagnote": "ZAG sits outside the top five, and that is the useful finding rather than a slight. Its BrAId project is a real applied-AI programme on a genuinely distinctive asset — the SiWIM bridge weigh-in-motion archive, which most national institutes simply do not have. What it lacks is the methodological partner and the compute that the five clusters take for granted. Both are reachable: SLAIF sits 120 km away in Maribor with the Jožef Stefan Institute as technical coordinator and the University of Ljubljana already in the consortium, and ETH's Structural Mechanics and Monitoring chair works on exactly the physics-enhanced ML that B-WIM quality control needs. Sheffield's population-based SHM framing — pooling data across a population of nominally similar structures — maps almost directly onto a national bridge stock.", "bands": [[5, "Direct route", "Act on this one"], [4, "Strong fit", "Worth approaching"], [3, "Useful", "Follow the work"], [2, "Peripheral", "Context only"], [1, "Weak", "For completeness"]], "home": [49.8, 11.6, 757.0, 838.3], "shp": {"MT": {"d": "M478.9 819.7L479.4 820.7L478.2 821.5L475.6 820.5L475.1 820.0L475.1 817.8L477.9 818.9L478.1 819.8L478.9 819.7ZM473.0 817.1L472.2 816.5L473.0 815.8L function paint(){
 const q=query.trim().toLowerCase();
 // A country is the context, a site is the focus inside it. Picking a marker in
 // another country moves the context there rather than dropping it.
 const focus=selRank?DATA.rank.find(r=>r.n===selRank).ids:
  (selCn?DATA.sites.filter(x=>x.cc===selCn).map(x=>x.id):(sel?[sel]:null));
 const per={};
 for(const s of DATA.sites){
  let ok=(dom==='all'||s.dom.indexOf(dom)>=0)&&s.sc>=minSc;
  if(ok&&q)ok=(s.n+' '+s.city+' '+s.cn+' '+s.sec.join(' ')+' '+s.ll+' '+
   s.people.join(' ')+' '+(s.b||'')).toLowerCase().indexOf(q)>=0;
  s.hit=ok;
  if(!s.el)continue;
  const f=focus?focus.indexOf(s.id)>=0:false;
  const keep=(s.id===sel||s.id===pickId);   // an explicit pick stays visible
  const vis=ok||keep;
  const cl=s.el.classList;
  cl.toggle('off',!vis);
  cl.toggle('on',vis&&f);
  cl.toggle('mute',!!focus&&!(vis&&f));
  cl.toggle('pick',s.id===(pickId||sel));
  if(ok)per[s.cc]=(per[s.cc]||0)+1;
 }
 for(const name in CL){const c=CL[name],n=per[name]||0;
  c.el.classList.toggle('off',n===0);
  if(n){const r=9.5+Math.min(8,Math.sqrt(n)*2.4);
   c.c.setAttribute('r',r.toFixed(1));
   c.t.textContent=n;c.t.setAttribute('font-size',(n>99?9:n>9?10.5:11.5));}}
 clg.classList.toggle('hide',z>=CLZ);
 mkg.classList.toggle('hide',z<CLZ);

}

  '<li>Some entries list research programmes rather than individually verified papers</li>'+
  '<li>Entries without a developments section are ones where nothing could be verified</li>'+
  '<li>Inclusion test: an identifiable research centre or group, plus describable research. Ten teaching faculties were removed on review for failing it, and their countries now carry a factsheet note instead</li>'+
  '<li>The EU-funded filter covers instruments verified individually: all 19 AI Factories, all 12 EuroHPC systems, and the BRIDGITISE doctoral network. It is not a complete inventory of Horizon, MSCA COFUND or Interreg projects by country \u2014 there are thousands, and CORDIS is the authoritative register</li>'+
  '<li>Institution logos are drawn locally as monograms; no external image is fetched</li></ul></div>'+
  '<div class="card"><button class="rowbtn" data-reg="1"><b>Open the full source register</b>'+
  '<s>'+DATA.sites.length+'</s>'+CHEV+'</button></div>';
 const rg=pane.querySelector('[data-reg]');if(rg)rg.addEventListener('click',showRegister);
}
function intro(){
 pane.innerHTML='<h2 class="ttl">European AI, mapped</h2>'+
  '<p class="sub"><span>'+DATA.sites.length+' entries \u00b7 zoomed out, points group by country</span></p>'+
  '<div class="stats"><div><b>'+DATA.dcounts.compute+'</b><span>AI data centres</span></div>'+
  '<div><b>'+DATA.dcounts.ai+'</b><span>AI research teams</span></div>'+
  '<div><b>'+DATA.dcounts.civil+'</b><span>Civil engineering</span></div>'+
  '<div><b>'+DATA.dcounts.bridge+'</b><span>Bridge engineering</span></div></div>'+
  '<p class="body">Tap a green bubble or a country to fly in and spread its points apart. Countries are shaded by how many institutions sit in them. Everything opens with a five-dot rating of how relevant it is to ZAG, and the slider above the map hides anything below the threshold you set.</p>'+
  '<div class="hdr">Why these tabs</div>'+
  '<p class="body">The civil, bridge and industrial engineering tabs exist because ZAG\u2019s BrAId project sits exactly where they overlap: AI applied to bridge weigh-in-motion data. Open Bridge engineering to see the European groups on the same problem, then Rank to see how ZAG relates to the five leading clusters.</p>'+
  '<div class="hdr">The shape of it</div><div class="card"><ul>'+
  '<li>19 EuroHPC AI Factories selected since December 2024, on about \u20AC1.5bn</li>'+
  '<li>12 EuroHPC supercomputers; three in the world\u2019s top twelve</li>'+
  '<li>Up to 7 AI Gigafactories being procured, call closing 12 November 2026</li>'+
  '<li>44 ELLIS units across roughly 150 institutions</li></ul></div>';
}
setLayout();
window.addEventListener('resize',()=>{setLayout();rescale();if(atHome)goHome(false);});
intro();paint();rescale();
(function(){const h=decodeURIComponent(location.hash.replace('#',''));
 if(h.indexOf('c=')===0&&DATA.shp[h.slice(2)]){const c=h.slice(2);
  setTimeout(()=>{zoomCountry(DATA.shp[c].bb);showCountry(c);},90);return;}
 if(h&&DATA.sites.some(s=>s.id===h))setTimeout(()=>select(h),80);})();

function pt(e){const r=svg.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H);
 return [(e.clientX-r.left-(r.width-W*s)/2)/s,(e.clientY-r.top-(r.height-H*s)/2)/s];}
const wrap=document.getElementById('wrap');
wrap.addEventListener('wheel',e=>{
 if(e.target.closest('.hud')||e.target.closest('.mapfoot'))return;
 e.preventDefault();const p=pt(e);zoomAt(e.deltaY<0?1.18:1/1.18,p[0],p[1]);},{passive:false});
document.getElementById('zin').onclick=()=>zoomAt(1.5,W/2,H/2);
document.getElementById('zout').onclick=()=>zoomAt(1/1.5,W/2,H/2);
function goHome(anim){const b=DATA.home,v=view();
 const nz=Math.max(1,Math.min(8,Math.min(v[0]/((b[2]-b[0])*1.02),v[1]/((b[3]-b[1])*1.02))));
 const px=(b[0]+b[2])/2,py=(b[1]+b[3])/2;
 if(anim)glideTo(nz,W/2-px*nz,H/2-py*nz);
 else{z=nz;tx=W/2-px*nz;ty=H/2-py*nz;apply();rescale();paint();}
 atHome=true;}
document.getElementById('zres').onclick=()=>{markCountry(null);
 if(atHome){glideTo(1,0,0);atHome=false;}else goHome(true);};
let drag=null,raf=0;const ptrs=new Map();let pinch=null;
const gap=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
const mid=(a,b)=>({clientX:(a.clientX+b.clientX)/2,clientY:(a.clientY+b.clientY)/2});
let downT=null,downX=0,downY=0,moved=false;
wrap.addEventListener('pointerdown',e=>{
 if(e.target.closest('.m')||e.target.closest('.cl')||e.target.closest('button')||
    e.target.closest('.hud')||e.target.closest('.mapfoot'))return;
 ptrs.set(e.pointerId,e);wrap.setPointerCapture(e.pointerId);
 if(ptrs.size===2){const a=[...ptrs.values()];drag=null;wrap.classList.remove('drag');
  pinch={d:gap(a[0],a[1])||1};cancelAnimationFrame(camRaf);moved=true;return;}
 if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,tx:tx,ty:ty};wrap.classList.add('drag');
  downT=e.target;downX=e.clientX;downY=e.clientY;moved=false;}});
wrap.addEventListener('pointermove',e=>{
 if(!ptrs.has(e.pointerId)&&!drag)return;
 if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,e);
 if(pinch&&ptrs.size>=2){
  const a=[...ptrs.values()],nd=gap(a[0],a[1])||1,c=pt(mid(a[0],a[1]));
  zoomAt(nd/pinch.d,c[0],c[1]);pinch.d=nd;return;}
 if(!drag)return;
 if(Math.abs(e.clientX-downX)+Math.abs(e.clientY-downY)>5)moved=true;
 const r=svg.getBoundingClientRect(),sc=Math.min(r.width/W,r.height/H);
 tx=drag.tx+(e.clientX-drag.x)/sc;ty=drag.ty+(e.clientY-drag.y)/sc;
 if(!raf)raf=requestAnimationFrame(()=>{raf=0;apply();});});
// Resolve the tap ourselves: a press on any part of a country's landmass switches
// to that country; a press on empty water clears the selection.
['pointerup','pointercancel','pointerleave'].forEach(t=>wrap.addEventListener(t,e=>{
 ptrs.delete(e.pointerId);if(ptrs.size<2)pinch=null;
 if(ptrs.size)return;
 drag=null;wrap.classList.remove('drag');
 if(t==='pointerup'&&!moved&&downT){
  const cy=downT.closest?downT.closest('.cy'):null;
  if(cy)openCountry(cy.getAttribute('data-cy'));
  else clearSel();
 }
 downT=null;moved=false;}));
goHome(false);
</script></body></html>
