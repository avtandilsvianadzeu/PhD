tresearch.com/en", "host": "vttresearch.com", "mono": "VT", "meta": [["Note", "Programme-level description; FCAI partnership verified"]], "sec": ["Applied AI", "Manufacturing", "Built environment"], "b": "Finland's state-owned applied research company and a partner in FCAI, spanning manufacturing, the built environment and quantum alongside its AI work.", "maj": ["Applied AI within FCAI, the Finnish Center for Artificial Intelligence", "Manufacturing and industrial digitalisation research"], "sid": ["Built environment and materials", "Quantum technology"], "rank": 0, "people": [], "papers": [], "est": "1942", "hist": null, "fut": null, "news": [], "snip": "VTT — Finland's state applied research centre, and an FCAI partner.", "zr": "Another state-owned applied research body of ZAG's type, but one that sits inside a national AI centre as a formal partner. That arrangement — testing institute as a member of the country's AI centre rather than a customer of it — is a model worth examining for the ZAG–Jožef Stefan relationship.", "sc": 3, "ct": [null, null], "era": null, "life": null, "ox": 0.0, "oy": 14.4, "cc": "FI"}, {"id": "idiap", "n": "Idiap Research Institute", "city": "Martigny", "cn": "Switzerland", "iso": "ch", "x": 350.2, "y": 594.6, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://www.idiap.ch", "host": "idiap.ch", "mono": "IR", "meta": [["Affiliation", "EPFL"], ["Note", "Programme-level description; papers not individually verified"]], "sec": ["Speech & language", "Computer vision", "Machine learning"], "b": "An independent non-profit research institute affiliated with EPFL, long established in speech processing, computer vision and multimodal machine learning.", "maj": ["Speech and language processing", "Computer vision and biometrics"], "sid": ["Multimodal machine learning", "Robot learning"], "rank": 0, "people": [], "papers": [], "est": "1991", "hist": null, "fut": null, "news": [], "snip": "Idiap — an independent machine learning research institute in the Swiss Valais.", "zr": "Not a domain partner, but a useful precedent: a small independent institute that built an international reputation in machine learning without a university behind it. Relevant to any argument about what a focused research unit inside ZAG could become.", "sc": 2, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "CH"}, {"id": "tartu", "n": "University of Tartu — Institute of Computer Science", "city": "Tartu", "cn": "Estonia", "iso": "ee", "x": 590.4, "y": 298.3, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://cs.ut.ee/en", "host": "cs.ut.ee", "mono": "UT", "meta": [["Note", "Programme-level description; papers not individually verified"]], "sec": ["Machine learning", "NLP", "Data science"], "b": "Estonia's principal computer science research centre, with a machine learning group that anchors a country whose public digital infrastructure is unusually advanced for its size.", "maj": ["Machine learning and natural language processing research", "Applied data science with Estonian public institutions"], "sid": ["Computer vision", "Bioinformatics"], "rank": 0, "people": [], "papers": [], "est": "1632", "hist": null, "fut": null, "news": [], "snip": "Institute of Computer Science, University of Tartu.", "zr": "Estonia is the clearest example in Europe of a small state building national digital capability from a low base, and Tartu supplies its research. Relevant as a comparison for Slovenia rather than as a direct collaborator. Estonia also sits in the LUMI AI Factory consortium.", "sc": 2, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "EE"}, {"id": "kinit", "n": "Kempelen Institute of Intelligent Technologies (KInIT)", "city": "Bratislava", "cn": "Slovakia", "iso": "sk", "x": 501.8, "y": 544.7, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://kinit.sk", "host": "kinit.sk", "mono": "KInIT", "meta": [["Type", "Independent non-profit institute"], ["National platform", "Slovak.AI, created 2019"], ["Facts verified", "Yes — institute and EC AI Watch records"]], "sec": ["Trustworthy AI", "Human-computer interaction", "Disinformation", "NLP"], "b": "An independent non-profit research institute, deliberately built outside the university system to combine academic researchers with the needs of innovative companies. It connects to the Slovak universities, the Slovak Academy of Sciences and the international community rather than competing with them — an unusual and instructive model for a small country.", "maj": ["Trustworthy AI and human-computer interaction research", "Applied research partnerships with companies, run alongside academic supervision"], "sid": ["Work on disinformation and information integrity", "Slovaks AI Forum, run under the Slovak Diaspora Project to connect Slovak AI experts abroad"], "rank": 0, "people": ["Prof. Mária Bieliková — CEO; human-computer interaction and trustworthy AI; awarded the Order of Ľudovít Štúr, 2nd class, in 2024"], "papers": [], "est": "2020", "hist": null, "fut": null, "news": [{"d": "19 Jun 2025", "t": "Hosts the Slovaks AI Forum in Bratislava, opened by President Zuzana Čaputová.", "u": "https://kinit.sk"}], "snip": "KInIT — an independent institute for intelligent technologies research in Bratislava.", "zr": "The clearest example on this map of a small country building AI research capacity through a new independent institute rather than a university department. Its CEO's field, trustworthy AI and human-computer interaction, is also the register a notified body has to work in. Worth studying as an organisational model as much as a research partner.", "sc": 3, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "SK"}, {"id": "ivi", "n": "Institute for Artificial Intelligence Research and Development of Serbia (IVI)", "city": "Novi Sad", "cn": "Serbia", "iso": "rs", "x": 550.8, "y": 604.4, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://ivi.ac.rs/en/", "host": "ivi.ac.rs", "mono": "IVI", "meta": [["Founded by", "Government of Serbia, March 2021"], ["Base", "Science and Technology Park, Novi Sad"], ["Facts verified", "Yes — institute and government pages"]], "sec": ["Applied AI", "Medical diagnostics", "Automotive", "Materials discovery"], "b": "Founded by the Government of Serbia in March 2021, with offices in science and technology parks across the country. Its stated purpose is as much economic as scientific: to build a domestic AI sector, and to patent and commercialise most of what its researchers produce through licensing, start-ups and spin-offs.", "maj": ["Applied AI across automotive, medical diagnostics, finance, drug and materials discovery", "Technology transfer into the Serbian economy, with an IP policy favouring researchers and industry partners"], "sid": ["S4AI_HUB, a digital innovation hub engaged in Western Balkan regional cooperation", "Incubation of AI start-ups and spin-offs"], "rank": 0, "people": ["Prof. Dr Dubravko Ćulibrk — Acting Director"], "papers": [], "est": "2021", "hist": null, "fut": null, "news": [], "snip": "IVI — Serbia's national institute for AI research and development, Novi Sad.", "zr": "Relevant to ZAG as a regional neighbour rather than a methodological partner, and as a comparison case: a Western Balkan state that chose to create a national AI institute from scratch. SLAIF's mandate is explicitly regional, which makes Serbia part of the catchment Slovenia is expected to serve.", "sc": 2, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "RS"}, {"id": "cyens", "n": "CYENS Centre of Excellence", "city": "Nicosia", "cn": "Cyprus", "iso": "cy", "x": 820.3, "y": 773.0, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://cyens.org.cy", "host": "cyens.org.cy", "mono": "CC", "meta": [["Type", "Centre of excellence"], ["Facts verified", "Yes — centre pages, 2026"]], "sec": ["Interactive media", "Smart systems", "Computer vision", "Human factors"], "b": "Cyprus's centre of excellence for research and innovation in interactive media, smart systems and emerging technologies, working under the motto 'Inspired by Humans, Designed for Humans'. Its research spans visual sciences, human factors and design, communication and artificial intelligence.", "maj": ["Research in visual sciences, human factors and design, communication and AI", "Co-innovation partnerships giving smaller organisations access to research capability they cannot build in-house"], "sid": ["CYENS Summer School 2026, 22–26 June, a free AI programme for students aged 15 and over led by Prof. Marios Pattichis, co-sponsored by the IEEE Signal Processing Society"], "rank": 0, "people": [], "papers": [], "est": "2018", "hist": null, "fut": null, "news": [{"d": "22–26 Jun 2026", "t": "Runs its Summer School on AI for students aged 15+, led by Prof. Marios Pattichis.", "u": "https://cyens.org.cy"}], "snip": "CYENS — Cyprus's centre of excellence in interactive media, smart systems and emerging technologies.", "zr": "Peripheral to civil engineering, but a useful model of an EU Teaming-style centre of excellence in a very small member state — the mechanism by which a country without a large research base acquires one. Its visual sciences work is the transferable part, since inspection imagery is a computer vision problem.", "sc": 2, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "CY"}, {"id": "snt", "n": "Interdisciplinary Centre for Security, Reliability and Trust (SnT)", "city": "Luxembourg City", "cn": "Luxembourg", "iso": "lu", "x": 340.1, "y": 515.4, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://www.uni.lu/snt-en/", "host": "uni.lu", "mono": "SnT", "meta": [["Part of", "University of Luxembourg"], ["Note", "Programme-level description; papers not individually verified"]], "sec": ["Trustworthy systems", "Software verification", "Space systems", "FinTech"], "b": "The University of Luxembourg's interdisciplinary centre for security, reliability and trust, and the country's principal computer science research body. Notable for running a large partnership programme in which companies co-fund and co-locate research projects.", "maj": ["Security, reliability and trust in software and cyber-physical systems", "Partnership programme with co-funded, co-located industrial research projects"], "sid": ["Space systems and satellite communications", "FinTech and regulatory technology", "Automated software testing and verification"], "rank": 0, "people": [], "papers": [], "est": "2009", "hist": null, "fut": null, "news": [], "snip": "SnT — security, reliability and trust research at the University of Luxembourg.", "zr": "Software verification and dependability are the disciplines that answer the question a notified body has to answer about any AI system: on what basis do you trust this output. SnT is also the research half of a country whose AI Factory explicitly sells prototyping and testing support, which makes Luxembourg an unusually accessible entry point for a small institute with a defined problem.", "sc": 3, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "LU"}, {"id": "imec", "n": "imec", "city": "Leuven", "cn": "Belgium", "iso": "be", "x": 320.6, "y": 486.5, "L": "research", "ll": "Research centre", "dom": ["ai", "industrial"], "url": "https://www.imec-int.com", "host": "imec-int.com", "mono": "·", "meta": [["Type", "Independent research centre"], ["Note", "Programme-level description; papers not individually verified"]], "sec": ["Nanoelectronics", "Edge AI", "AI hardware", "Sensors"], "b": "One of the world's largest independent research centres in nanoelectronics and digital technology, headquartered in Leuven with sites across Flanders and abroad. Its relevance to AI is at the hardware end: chips, sensors and the energy cost of computation.", "maj": ["Nanoelectronics and chip technology research at industrial scale", "Edge and embedded AI hardware, including low-power inference"], "sid": ["Sensor systems and imaging technology", "Health and life sciences technology"], "rank": 0, "people": [], "papers": [], "est": "1984", "hist": null, "fut": null, "news": [], "snip": "imec — nanoelectronics and digital technology research, Leuven.", "zr": "Edge AI is the practical constraint for structural monitoring. A sensor on a bridge has a power budget and no reliable network, so the model has to run on the device — which is imec's territory rather than a machine learning department's. Directly relevant to any ambition to move B-WIM processing to the roadside.", "sc": 3, "ct": [null, null], "era": null, "life": null, "ox": 0.0, "oy": 14.4, "cc": "BE"}, {"id": "iiia", "n": "Artificial Intelligence Research Institute (IIIA-CSIC)", "city": "Bellaterra, Barcelona", "cn": "Spain", "iso": "es", "x": 263.2, "y": 691.0, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://www.iiia.csic.es", "host": "iiia.csic.es", "mono": "IIIA-CSIC", "meta": [["Part of", "CSIC, the Spanish National Research Council"], ["Also in", "ELLIS Unit Barcelona"], ["Note", "Programme-level description; papers not individually verified"]], "sec": ["Multi-agent systems", "Reasoning", "Machine learning", "AI ethics"], "b": "One of the oldest dedicated AI research institutes in Europe, part of the Spanish National Research Council. Long-standing strengths in multi-agent systems, automated reasoning, argumentation and constraint satisfaction, alongside more recent work on responsible AI.", "maj": ["Multi-agent systems, automated reasoning and argumentation", "Constraint satisfaction and optimisation"], "sid": ["Machine learning and case-based reasoning", "Responsible and value-aligned AI"], "rank": 0, "people": [], "papers": [], "est": "1994", "hist": null, "fut": null, "news": [], "snip": "IIIA-CSIC — the Spanish national artificial intelligence research institute.", "zr": "Argumentation and constraint reasoning are the symbolic side of AI, and they matter here for a specific reason: a code check is a constraint satisfaction problem, not a prediction problem. Any system that has to respect Eurocode limits while learning from data needs both, and IIIA is one of the few places that has kept the symbolic tradition alive.", "sc": 2, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "ES"}, {"id": "isti", "n": "Institute of Information Science and Technologies (ISTI-CNR)", "city": "Pisa", "cn": "Italy", "iso": "it", "x": 402.6, "y": 648.6, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://www.isti.cnr.it", "host": "isti.cnr.it", "mono": "ISTI-CNR", "meta": [["Part of", "CNR, the Italian National Research Council"], ["Note", "Programme-level description; papers not individually verified"]], "sec": ["Information science", "Knowledge discovery", "Visual computing", "Trustworthy AI"], "b": "The Institute of Information Science and Technologies of the Italian National Research Council, in the Pisa research area — historically the centre of Italian computer science. Strong in knowledge discovery, visual computing and, more recently, explainable and trustworthy AI.", "maj": ["Knowledge discovery, data mining and explainable AI", "Visual computing, signals and images"], "sid": ["Networking and high-performance computing", "Software engineering and dependable systems"], "rank": 0, "people": [], "papers": [], "est": "2002", "hist": null, "fut": null, "news": [], "snip": "ISTI-CNR — information science and technologies research in the Pisa research area.", "zr": "The Pisa group's work on explainable AI is directly usable: it produced some of the most-cited surveys on methods for explaining black-box models, which is the literature anyone has to cite when justifying an AI-derived decision to a regulator.", "sc": 2, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "IT"}, {"id": "athena-rc", "n": "Athena Research Center · Archimedes Unit", "city": "Athens", "cn": "Greece", "iso": "gr", "x": 637.7, "y": 753.9, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://www.athenarc.gr/en", "host": "athenarc.gr", "mono": "AR", "meta": [["Role", "Pharos AI Factory consortium partner"], ["Note", "Factory role verified; other work described at programme level"]], "sec": ["Foundations of AI", "Data management", "Language technology"], "b": "Greece's research centre for information and communication technologies, hosting the Archimedes unit dedicated to the foundations of AI, and a partner in the Pharos AI Factory consortium.", "maj": ["Archimedes — a research unit on the foundations of artificial intelligence", "Partner in the Pharos AI Factory consortium"], "sid": ["Data management and information systems", "Greek language technology and digital heritage"], "rank": 0, "people": [], "papers": [], "est": "2003", "hist": null, "fut": null, "news": [], "snip": "Athena Research Center — Greek ICT research, host of the Archimedes AI unit.", "zr": "Archimedes is a recent, deliberate bet on theoretical AI in a country that had no such centre — comparable in intent to what INSAIT did in Bulgaria. Relevant to ZAG mainly through the Greek AI Factory, which built compliance services around the EU AI Act that other national bodies can learn from.", "sc": 2, "ct": [null, null], "era": null, "life": null, "ox": 0.0, "oy": 14.4, "cc": "EL"}, {"id": "cadia", "n": "Center for Analysis and Design of Intelligent Agents (CADIA)", "city": "Reykjavik", "cn": "Iceland", "iso": "is", "x": 94.9, "y": 122.8, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://cadia.ru.is", "host": "cadia.ru.is", "mono": "CADIA", "meta": [["Note", "Programme-level description; papers not individually verified"]], "sec": ["Artificial general intelligence", "Intelligent agents", "Simulation"], "b": "The Center for Analysis and Design of Intelligent Agents at Reykjavik University, one of the few European groups working explicitly on architectures for general machine intelligence rather than task-specific learning.", "maj": ["Architectures for artificial general intelligence and autonomous skill acquisition", "Intelligent agents and multi-agent simulation"], "sid": ["Human-agent interaction and dialogue systems"], "rank": 0, "people": [], "papers": [], "est": "2006", "hist": null, "fut": null, "news": [], "snip": "CADIA — Center for Analysis and Design of Intelligent Agents, Reykjavik.", "zr": "Not a partner, but a useful counterweight. The group works on systems that acquire skills without being retrained from scratch, which is the property any long-lived monitoring installation would ideally have and current methods do not.", "sc": 1, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "IS"}, {"id": "lu-imcs", "n": "University of Latvia — Institute of Mathematics and Computer Science", "city": "Riga", "cn": "Latvia", "iso": "lv", "x": 567.1, "y": 336.2, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://www.lumii.lv/en/", "host": "lumii.lv", "mono": "UL", "meta": [["Note", "Programme-level description; papers not individually verified"]], "sec": ["Machine learning", "Language technology", "Semantic web"], "b": "Latvia's principal computer science research institute, with long-standing work in Latvian language technology, semantic technologies and machine learning — the research side of an ecosystem whose commercial expression is Tilde.", "maj": ["Latvian language technology and machine translation research", "Semantic technologies and knowledge representation"], "sid": ["Machine learning and data science", "Cooperation with Tilde on multilingual models"], "rank": 0, "people": [], "papers": [], "est": "1959", "hist": null, "fut": null, "news": [], "snip": "IMCS — Institute of Mathematics and Computer Science, University of Latvia.", "zr": "Latvia is the working proof that a two-million-person language community can get a usable open model built on EuroHPC compute rather than commercial cloud. IMCS supplies the research behind that, and the same argument applies to Slovene.", "sc": 2, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "LV"}, {"id": "vu-mif", "n": "Vilnius University — Institute of Data Science and Digital Technologies", "city": "Vilnius", "cn": "Lithuania", "iso": "lt", "x": 592.5, "y": 382.0, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://mif.vu.lt/en/", "host": "mif.vu.lt", "mono": "VU", "meta": [["Role", "Leads the LitAI Factory"], ["Note", "Factory role verified; other work described at programme level"]], "sec": ["Data science", "Optimisation", "Cognitive computing"], "b": "Lithuania's main data science and AI research institute, within Vilnius University's Faculty of Mathematics and Informatics, and the lead institution behind the LitAI Factory.", "maj": ["Data science, optimisation and cognitive computing research", "Lead institution for the LitAI Factory"], "sid": ["Blockchain and distributed systems", "Applied informatics with Lithuanian public bodies"], "rank": 0, "people": [], "papers": [], "est": "1956", "hist": null, "fut": null, "news": [], "snip": "Institute of Data Science and Digital Technologies, Vilnius University.", "zr": "Directly connected to the LitAI Factory, which Vilnius University leads. Relevant as a comparison: another small Baltic state converting existing HPC into sovereign AI infrastructure, on much the same timetable as Slovenia.", "sc": 2, "ct": [null, null], "era": null, "life": null, "ox": 0.0, "oy": 14.4, "cc": "LT"}, {"id": "bilgem", "n": "Informatics and Information Security Research Center (TÜBİTAK BİLGEM)", "city": "Gebze, Kocaeli", "cn": "Turkey", "iso": "tr", "x": 722.8, "y": 671.4, "L": "research", "ll": "Research centre", "dom": ["ai", "industrial"], "url": "https://bilgem.tubitak.gov.tr/en", "host": "bilgem.tubitak.gov.tr", "mono": "II", "meta": [["Parent", "TÜBİTAK, the Scientific and Technological Research Council of Türkiye"], ["Campus", "Gebze, Kocaeli"], ["Facts verified", "Yes — TÜBİTAK records"]], "sec": ["Informatics", "Cryptology", "Information security", "Applied research"], "b": "Türkiye's central government research centre for informatics, established in 2010 on the TÜBİTAK Gebze campus as an umbrella over the existing Information Technologies Institute and the National Research Institute of Electronics and Cryptology, which itself dates to 1994. It is the state's principal applied computing capability.", "maj": ["Applied informatics research through subordinate institutes on the Gebze campus", "UEKAE, the National Research Institute of Electronics and Cryptology, founded 1994 — information security and cryptology"], "sid": ["Information Technologies Institute (BTE)", "TÜBİTAK is a named partner in the BSC AI Factory consortium", "ULAKBİM in Ankara operates the national academic network and information centre"], "rank": 0, "people": [], "papers": [], "est": "2010", "hist": "Formed in 2010 by consolidating institutes transferred from the TÜBİTAK Marmara Research Center, which has operated at Gebze since 1972.", "fut": null, "news": [], "snip": "TÜBİTAK BİLGEM — Türkiye's national informatics and information security research centre.", "zr": "Türkiye is a formal partner in the BSC AI Factory consortium, which is the route by which Turkish institutions reach EuroHPC compute — the same mechanism Slovenia uses through IT4LIA and SLAIF. TÜBİTAK is the national body on the other side of that arrangement, and the closest thing Türkiye has to a state institute of ZAG's character.", "sc": 3, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "TR"}, {"id": "kuis", "n": "Koç University İş Bankası AI Center (KUIS AI)", "city": "Istanbul", "cn": "Turkey", "iso": "tr", "x": 713.7, "y": 664.2, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://ai.ku.edu.tr", "host": "ai.ku.edu.tr", "mono": "KUIS", "meta": [["Founded", "February 2020, with İş Bankası"], ["Facts verified", "Yes — university records"]], "sec": ["Machine learning", "NLP", "Computer vision", "Medical imaging"], "b": "Established in February 2020 by Koç University together with İş Bankası as a centre of excellence in artificial intelligence, combining the university's College of Engineering with private funding. It has become the most visible academic AI centre in Türkiye.", "maj": ["Machine learning, natural language processing and computer vision research", "Interdisciplinary applications, including medical image analysis"], "sid": ["Doctoral and postdoctoral training as Türkiye's AI talent pipeline", "Industry collaboration through the İş Bankası partnership"], "rank": 0, "people": ["Prof. Çiğdem Gündüz Demir — Director", "Prof. Deniz Yuret — natural language processing"], "papers": [], "est": "2020", "hist": null, "fut": null, "news": [], "snip": "KUIS AI — the Koç University and İş Bankası artificial intelligence centre, Istanbul.", "zr": "Not a domain partner, but a clean example of a model ZAG might recognise: a university centre funded by a single large commercial backer rather than by public research money, built in five years from nothing. Relevant if the question is how to finance an AI capability that national research grants will not cover.", "sc": 2, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "TR"}, {"id": "bridgitise", "n": "Industrial Doctoral Network on Bridge Digitalised Integrity Management (BRIDGITISE)", "city": "Ljubljana (ZAG node)", "cn": "Slovenia", "iso": "si", "x": 465.8, "y": 594.1, "L": "project", "ll": "EU-funded project", "dom": ["eu", "bridge", "civil", "ai"], "url": "https://www.bridgitise.polimi.it/", "host": "bridgitise.polimi.it", "mono": "BRIDGITISE", "meta": [["Instrument", "MSCA Industrial Doctoral Network, Horizon Europe"], ["Call", "HORIZON-MSCA-2022-DN-01"], ["CORDIS project", "101119554"], ["Coordinator", "Maria Pina Limongelli, Politecnico di Milano"], ["Kick-off", "24–25 January 2024"], ["Doctoral candidates", "16, in three clusters"], ["ZAG positions", "DC4 and DC7"], ["Partner countries", "Italy, Slovenia, Denmark, Netherlands, Sweden, Spain, France, Germany, Switzerland, Estonia, Greece, Croatia"], ["Facts verified", "Yes — project site, ZAG and CORDIS records"]], "sec": ["MSCA Industrial Doctoral Network", "Bridge integrity management", "B-WIM", "Digital twins"], "b": "The first Industrial Doctorate in the EU dedicated to bridge integrity management, funded under Horizon Europe call HORIZON-MSCA-2022-DN-01 and coordinated by Maria Pina Limongelli at Politecnico di Milano. Sixteen doctoral candidates are distributed across three clusters: digital technologies for collecting bridge information; AI and IoT for processing and sharing it; and digital tools to support decisions across the bridge lifecycle. Every candidate spends at least eighteen months with a non-academic partner, which is what makes it an industrial rather than an academic network. ZAG hosts two of the sixteen positions.", "maj": ["DC4 — Advanced Bridge Weigh-in-Motion performance using vision-based data and machine learning. Hosted by ZAG with Cestel, supervised by Aleš Žnidarič and Andrej Anžlin at ZAG and M. Skobir at Cestel. The objective is enforcement-based B-WIM: pairing measured and processed strain data with synchronised traffic-camera photographs, building a vision algorithm during the secondment at TWE to extract vehicle type and dimensions, then combining both data pillars into a machine-learning classification tool accurate enough to meet metrology requirements", "DC7 — Automating the integration of continuous monitoring information into Bridge Management Systems. Hosted by Bexel Consulting with ZAG, supervised by S. Lenart at ZAG and I. Osmokrovic at Bexel, including a module to estimate performance indicators under the Slovenian BrIM"], "sid": ["Cluster 1, data collection: SATELLITE (InSAR and environmental measurements for anomaly detection), DRONES (automated UAV visual inspection), ROBOT (legged platforms such as Boston Dynamics SPOT), EDGE (edge computing with dense low-cost sensing)", "Cluster 3, decision support: PLATFORM (integrating SHM data into bridge management), TWINS (probabilistic digital twins for continuous performance), D-BIM (BIM-based decision support, DC16 with Wölfel Engineering)", "D-BOOK — an open-access portal publishing the network's data, software, models and results", "Technology-enhanced training, international workshops and Training Schools across the consortium"], "rank": 0, "people": ["Prof. Maria Pina Limongelli, Politecnico di Milano — Project Coordinator", "Doc. dr. Aleš Žnidarič, Director of ZAG — DC4 supervisor", "Dr Andrej Anžlin, Head of the Section for Bridges and other Civil Engineering Structures, ZAG — DC4 supervisor", "M. Skobir, Cestel — DC4 industrial supervisor", "Dr Stanislav Lenart, ZAG — DC7 supervisor"], "papers": [], "est": "2024", "hist": "Bridge integrity management lags other industries in digitalisation, and a large share of European bridges have been in service more than half a century, often under loading that departs substantially from their original design assumptions. BRIDGITISE was funded to close that gap by training a cohort rather than funding individual projects, deliberately splitting each doctorate between academia and industry.", "fut": "Prolonging highway bridge life on the basis of measured rather than assumed traffic loads is the economic argument: it reduces both material use and traffic disruption, and the project estimates savings in the millions of euros annually in maintenance and user costs. DC4's enforcement-grade B-WIM is the piece that makes measured loads legally usable.", "news": [{"d": "24–25 Jan 2024", "t": "Kick-off meeting under coordinator Maria Pina Limongelli at Politecnico di Milano.", "u": "https://www.bridgitise.polimi.it/"}, {"d": "21–22 Jan 2026", "t": "ZAG hosts two BRIDGITISE events in Ljubljana: a research workshop on 'From research questions to collaborative pathways in digitalised infrastructure monitoring', then a stakeholder workshop on the progress of digital transformation in bridge integrity management, aimed at industry and infrastructure managers.", "u": "https://www.bridgitise.polimi.it/"}], "snip": "BRIDGITISE — the EU's first industrial doctoral network for bridge integrity management.", "zr": "This is ZAG's own project, and DC4 is the reason much of the rest of this map matters. The objective — enforcement-based B-WIM from vision data plus machine learning, accurate enough to satisfy metrology requirements — is the same problem BrAId attacks from the data-quality side, and the two reinforce each other. The people to read are already here: Eugene OBrien at UCD published a physics-informed neural network for B-WIM without prior axle-location knowledge in 2025; ETH's Structural Mechanics and Monitoring chair works on separating damage from operational variability; Sheffield's population-based SHM answers what to do when labelled damage data does not exist; BAM's Nibelungen Bridge living lab is a working template for reconfigurable sensing aimed at AI models; and Sandra Wachter's counterfactual explanations are the mechanism by which an enforcement decision becomes legally defensible. Compute for the machine-learning half sits 120 km away at SLAIF and Vega.", "sc": 5, "ct": ["ZAG, Dimičeva ulica 12, 1000 Ljubljana (DC4 and DC7 host)", "bridgitise.polimi.it — Research"], "era": null, "life": null, "ox": -18.8, "oy": 0.0, "cc": "SI"}, {"id": "ph-turing", "n": "Alan Turing", "city": "Manchester", "cn": "United Kingdom", "iso": "gb", "x": 233.5, "y": 417.3, "L": "thinker", "ll": "Mathematician and logician", "dom": ["phil"], "url": "", "host": "", "mono": "AT", "meta": [["Lifespan", "1912–1954"], ["Era", "Foundational"], ["Based", "Manchester, United Kingdom"]], "sec": [], "b": "Set the terms of the entire debate. 'Computing Machinery and Intelligence' (1950) replaced the unanswerable question of whether machines think with an operational test, and set out the objections — theological, mathematical, consciousness, Lady Lovelace's — that the field has been re-arguing ever since.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Computing Machinery and Intelligence (Mind, 1950)", "u": null}, {"t": "On Computable Numbers (1936)", "u": null}, {"t": "Intelligent Machinery (1948, unpublished in his lifetime)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Computability, the limits of formal systems, and what counts as evidence that a system understands anything.", "zr": "The Lovelace objection — that a machine can only do what we know how to order it to do — is the exact objection a court would raise against an AI-derived weighing result. Turing's answer, that behaviour under test is the evidence, is the reason enforcement-grade validation has to be empirical rather than architectural.", "sc": 3, "ct": [null, null], "era": "Foundational", "life": "1912–1954", "ox": 0, "oy": 0, "cc": "UK"}, {"id": "ph-lovelace", "n": "Ada Lovelace", "city": "London", "cn": "United Kingdom", "iso": "gb", "x": 254.9, "y": 465.1, "L": "thinker", "ll": "Mathematician", "dom": ["phil"], "url": "", "host": "", "mono": "AL", "meta": [["Lifespan", "1815–1852"], ["Era", "Foundational"], ["Based", "London, United Kingdom"]], "sec": [], "b": "Her notes on the Analytical Engine contain the first serious argument about the limits of machine originality: the engine has no pretensions to originate anything, it can only do what we know how to order it to perform.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Notes on the Analytical Engine (1843), especially Note G", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "The originality question, and the first written program.", "zr": "Still the sharpest statement of why a learned model's output needs an account of provenance, not just accuracy.", "sc": 3, "ct": [null, null], "era": "Foundational", "life": "1815–1852", "ox": 0, "oy": 0, "cc": "UK"}, {"id": "ph-wiener", "n": "Norbert Wiener", "city": "Cambridge, MA", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Mathematician, founder of cybernetics", "dom": ["phil"], "url": "", "host": "", "mono": "NW", "meta": [["Lifespan", "1894–1964"], ["Era", "Foundational"], ["Based", "Cambridge, MA, United States"]], "sec": [], "b": "Founded cybernetics as the study of control and communication in machines and animals, and was the first to write seriously about automation displacing human judgement. His 1960 paper on the moral consequences of automation anticipates the alignment literature by sixty years.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Cybernetics (1948)", "u": null}, {"t": "The Human Use of Human Beings (1950)", "u": null}, {"t": "Some Moral and Technical Consequences of Automation (Science, 1960)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Feedback, control theory, and the ethics of delegating decisions to machines.", "zr": "Structural monitoring is a control problem before it is a learning problem. Wiener's framing — that a feedback system must be understood in terms of what it is allowed to act on — is the right one for automated bridge assessment.", "sc": 2, "ct": [null, null], "era": "Foundational", "life": "1894–1964", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-mcculloch", "n": "Warren McCulloch & Walter Pitts", "city": "Chicago", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Neurophysiologist and logician", "dom": ["phil"], "url": "", "host": "", "mono": "WM", "meta": [["Lifespan", "1943"], ["Era", "Foundational"], ["Based", "Chicago, United States"]], "sec": [], "b": "Their 1943 paper modelled the neuron as a logical threshold unit and showed such networks could compute any logical proposition. Every artificial neural network descends from it.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "A Logical Calculus of the Ideas Immanent in Nervous Activity (1943)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "The formal bridge between neuroscience and computation.", "zr": "Historical grounding: it explains why a neural network is a function approximator and not a brain, which matters when explaining a model to a regulator.", "sc": 2, "ct": [null, null], "era": "Foundational", "life": "1943", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-popper", "n": "Karl Popper", "city": "London", "cn": "United Kingdom", "iso": "gb", "x": 255.3, "y": 464.9, "L": "thinker", "ll": "Philosopher of science", "dom": ["phil"], "url": "", "host": "", "mono": "KP", "meta": [["Lifespan", "1902–1994"], ["Era", "Foundational"], ["Based", "London, United Kingdom"]], "sec": [], "b": "Argued that a theory earns scientific status by being falsifiable, not by accumulating confirming instances. Machine learning inverts this: models are validated by how often they are right, almost never by systematic attempts to break them.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "The Logic of Scientific Discovery (1934/1959)", "u": null}, {"t": "Conjectures and Refutations (1963)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Validation, testing, and the difference between a model that fits and a model that is true.", "zr": "The single most practically useful philosopher on this list for a testing institute. A B-WIM model should be validated by trying to falsify it under adversarial conditions — overloaded vehicles, unusual axle configurations, degraded sensors — not by reporting mean error on a benign dataset.", "sc": 3, "ct": [null, null], "era": "Foundational", "life": "1902–1994", "ox": -18.8, "oy": 0.0, "cc": "UK"}, {"id": "ph-simon", "n": "Herbert Simon & Allen Newell", "city": "Pittsburgh", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Cognitive scientists", "dom": ["phil"], "url": "", "host": "", "mono": "HS", "meta": [["Lifespan", "1916–2001 / 1927–1992"], ["Era", "Foundational"], ["Based", "Pittsburgh, United States"]], "sec": [], "b": "Proposed the physical symbol system hypothesis: a symbol system has the necessary and sufficient means for general intelligent action. Simon's separate work on bounded rationality — satisficing rather than optimising under real constraints — has outlasted the symbolic programme itself.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Human Problem Solving (1972)", "u": null}, {"t": "Computer Science as Empirical Inquiry (1976)", "u": null}, {"t": "Administrative Behavior (1947)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Symbolic AI, problem-solving as search, and decision-making under limited information.", "zr": "Bounded rationality describes asset management exactly: nobody optimises a bridge portfolio, they satisfice against budget and inspection capacity. Worth being explicit about that when framing what an AI system is actually for.", "sc": 2, "ct": [null, null], "era": "Foundational", "life": "1916–2001 / 1927–1992", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-mccarthy", "n": "John McCarthy", "city": "Stanford", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Computer scientist", "dom": ["phil"], "url": "", "host": "", "mono": "JM", "meta": [["Lifespan", "1927–2011"], ["Era", "Foundational"], ["Based", "Stanford, United States"]], "sec": [], "b": "Coined the term artificial intelligence for the 1956 Dartmouth proposal and spent his career arguing that intelligence requires explicit logical representation of knowledge about the world, including common sense.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Programs with Common Sense (1959)", "u": null}, {"t": "Some Philosophical Problems from the Standpoint of AI (1969, with Hayes)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Knowledge representation, formal logic, and the frame problem.", "zr": "The frame problem is alive in structural monitoring: a learned model has no representation of what it is not modelling, so it cannot tell you when the situation has changed underneath it.", "sc": 2, "ct": [null, null], "era": "Foundational", "life": "1927–2011", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-minsky", "n": "Marvin Minsky", "city": "Cambridge, MA", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Cognitive scientist", "dom": ["phil"], "url": "", "host": "", "mono": "MM", "meta": [["Lifespan", "1927–2016"], ["Era", "Foundational"], ["Based", "Cambridge, MA, United States"]], "sec": [], "b": "Co-founded the MIT AI Lab. His 1969 book with Papert on perceptron limitations is often blamed for the first AI winter; his later Society of Mind treats intelligence as many simple agents rather than one mechanism.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Perceptrons (1969, with Seymour Papert)", "u": null}, {"t": "The Society of Mind (1986)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Architecture of intelligence, and the politics of what a field chooses to believe about its own limits.", "zr": "Perceptrons is a cautionary tale about a well-argued negative result freezing a field. Useful when assessing sceptical claims about what AI cannot do for civil engineering.", "sc": 2, "ct": [null, null], "era": "Foundational", "life": "1927–2016", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-dreyfus", "n": "Hubert Dreyfus", "city": "Berkeley", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Phenomenologist", "dom": ["phil"], "url": "", "host": "", "mono": "HD", "meta": [["Lifespan", "1929–2017"], ["Era", "Critique"], ["Based", "Berkeley, United States"]], "sec": [], "b": "The most persistent critic of symbolic AI, arguing from Heidegger and Merleau-Ponty that human expertise is embodied, contextual and non-rule-governed, and cannot be captured by explicit representation. He was widely mocked and largely vindicated.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "What Computers Can't Do (1972)", "u": null}, {"t": "Mind over Machine (1986, with Stuart Dreyfus)", "u": null}, {"t": "Why Heideggerian AI Failed (2007)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Embodiment, tacit knowledge, and the limits of explicit representation.", "zr": "His five-stage model of skill acquisition, from novice to expert, is the standard reference for why an experienced bridge inspector's judgement resists being written down — and therefore why supervised learning on inspection labels is harder than it looks.", "sc": 2, "ct": [null, null], "era": "Critique", "life": "1929–2017", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-searle", "n": "John Searle", "city": "Berkeley", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Philosopher of mind and language", "dom": ["phil"], "url": "", "host": "", "mono": "JS", "meta": [["Lifespan", "b. 1932"], ["Era", "Critique"], ["Based", "Berkeley, United States"]], "sec": [], "b": "The Chinese Room argument (1980) claims that manipulating symbols according to rules never amounts to understanding them, however convincing the output. Forty-five years of rebuttals have not settled it, and large language models have made it urgent again.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Minds, Brains, and Programs (1980)", "u": null}, {"t": "The Rediscovery of the Mind (1992)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Syntax versus semantics; whether behavioural competence implies comprehension.", "zr": "Directly relevant to using language models over technical documentation: a system can produce a fluent summary of a standard without any grip on what the standard requires. That gap is a liability question, not a philosophical curiosity.", "sc": 2, "ct": [null, null], "era": "Critique", "life": "b. 1932", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-dennett", "n": "Daniel Dennett", "city": "Medford, MA", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Philosopher of mind", "dom": ["phil"], "url": "", "host": "", "mono": "DD", "meta": [["Lifespan", "1942–2024"], ["Era", "Critique"], ["Based", "Medford, MA, United States"]], "sec": [], "b": "Searle's long-running opponent. The intentional stance holds that treating a system as if it has beliefs and goals is a predictive strategy that is either useful or not, rather than a claim about inner life. He spent his last years warning that counterfeit people were the real danger of generative AI.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "The Intentional Stance (1987)", "u": null}, {"t": "Consciousness Explained (1991)", "u": null}, {"t": "From Bacteria to Bach and Back (2017)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Prediction versus explanation, and the ethics of systems that imitate persons.", "zr": "The intentional stance is a licence to be pragmatic: it does not matter whether a monitoring model 'understands' a bridge, only whether treating it as a predictor of load produces reliable results. That is a defensible engineering position.", "sc": 2, "ct": [null, null], "era": "Critique", "life": "1942–2024", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-boden", "n": "Margaret Boden", "city": "Brighton", "cn": "United Kingdom", "iso": "gb", "x": 253.7, "y": 479.4, "L": "thinker", "ll": "Cognitive scientist and historian of AI", "dom": ["phil"], "url": "", "host": "", "mono": "MB", "meta": [["Lifespan", "b. 1936"], ["Era", "Critique"], ["Based", "Brighton, United Kingdom"]], "sec": [], "b": "Founded the cognitive science programme at Sussex and wrote the definitive two-volume history of the field. Her work on computational creativity distinguishes combinatorial, exploratory and transformational creativity — a taxonomy that survives the generative-model era intact.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Mind as Machine: A History of Cognitive Science (2006)", "u": null}, {"t": "The Creative Mind (1990)", "u": null}, {"t": "AI: Its Nature and Future (2016)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "History of the field, and a rigorous account of machine creativity.", "zr": "Her taxonomy is a good sanity check on claims that a generative model has 'designed' something: almost all of it is exploratory within a fixed conceptual space, which is a real but bounded capability.", "sc": 3, "ct": [null, null], "era": "Critique", "life": "b. 1936", "ox": 0.0, "oy": -14.4, "cc": "UK"}, {"id": "ph-putnam", "n": "Hilary Putnam", "city": "Cambridge, MA", "cn": "United States", "iso": "us", "x": null, "y": null, "L": "thinker", "ll": "Philosopher", "dom": ["phil"], "url": "", "host": "", "mono": "HP", "meta": [["Lifespan", "1926–2016"], ["Era", "Critique"], ["Based", "Cambridge, MA, United States"]], "sec": [], "b": "Introduced functionalism and multiple realizability — the idea that a mental state is defined by its causal role, not its substrate — and then spent decades arguing against his own position.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Minds and Machines (1960)", "u": null}, {"t": "The Meaning of 'Meaning' (1975)", "u": null}, {"t": "Representation and Reality (1988)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Whether the substrate matters, and why meaning is not in the head.", "zr": "Multiple realizability is why a model trained on one sensor array can in principle transfer to another. Putnam's later doubts are why it often does not.", "sc": 2, "ct": [null, null], "era": "Critique", "life": "1926–2016", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-cantwell", "n": "Brian Cantwell Smith", "city": "Toronto", "cn": "Canada", "iso": "ca", "x": null, "y": null, "L": "thinker", "ll": "Philosopher and computer scientist", "dom": ["phil"], "url": "", "host": "", "mono": "BC", "meta": [["Lifespan", "b. 1950"], ["Era", "Critique"], ["Based", "Toronto, Canada"]], "sec": [], "b": "Distinguishes reckoning — the calculative capacity current systems have in abundance — from judgement, the committed, accountable engagement with a world that they do not have at all.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "The Promise of Artificial Intelligence: Reckoning and Judgment (2019)", "u": null}, {"t": "On the Origin of Objects (1996)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "The reckoning/judgement distinction, and what accountability requires.", "zr": "The most useful single distinction for a notified body. A model can reckon a load; a person has to judge whether the reckoning is fit to act on. Making that division explicit in a workflow is a defensible governance design.", "sc": 2, "ct": [null, null], "era": "Critique", "life": "b. 1950", "ox": 0, "oy": 0, "cc": ""}, {"id": "ph-vallor", "n": "Shannon Vallor", "city": "Edinburgh", "cn": "United Kingdom", "iso": "gb", "x": 231.3, "y": 360.6, "L": "thinker", "ll": "Baillie Gifford Chair in the Ethics of Data and AI", "dom": ["phil"], "url": "https://www.technomoralfutures.uk", "host": "technomoralfutures.uk", "mono": "SV", "meta": [["Lifespan", "b. 1968"], ["Era", "Contemporary"], ["Based", "Edinburgh, United Kingdom"]], "sec": [], "b": "Holds the Baillie Gifford Chair at the University of Edinburgh, co-directs the Centre for Technomoral Futures and the UKRI BRAID programme, and previously served as an AI ethicist at Google. Her argument is that the genuine existential risk is not machine takeover but human abdication: systems that mimic understanding invite us to surrender the work of thinking.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "The AI Mirror: How to Reclaim Our Humanity in an Age of Machine Thinking (OUP, 2024)", "u": null}, {"t": "Technology and the Virtues (OUP, 2016)", "u": null}], "est": null, "hist": null, "fut": null, "news": [{"d": "2026", "t": "Awarded the Barwise Prize by the American Philosophical Association.", "u": "https://www.technomoralfutures.uk"}], "snip": "Virtue ethics for technology, moral deskilling, and responsibility gaps in autonomous systems.", "zr": "Moral deskilling is a live risk for an inspection body: if a model flags the defects, inspectors stop practising the judgement that lets them catch what the model misses. Worth designing against explicitly.", "sc": 3, "ct": [null, null], "era": "Contemporary", "life": "b. 1968", "ox": 0.0, "oy": 14.4, "cc": "UK"}, {"id": "ph-coeck", "n": "Mark Coeckelbergh", "city": "Vienna", "cn": "Austria", "iso": "at", "x": 490.6, "y": 544.3, "L": "thinker", "ll": "Professor of Philosophy of Media and Technology", "dom": ["phil"], "url": "https://coeckelbergh.net", "host": "coeckelbergh.net", "mono": "MC", "meta": [["Lifespan", "b. 1975"], ["Era", "Contemporary"], ["Based", "Vienna, Austria"]], "sec": [], "b": "Belgian-born, based at the University of Vienna, also ERA Chair at the Institute of Philosophy of the Czech Academy of Sciences in Prague and guest professor at Uppsala and WASP-HS. A former member of the European Commission's High-Level Expert Group on AI. Works on relational rather than essentialist accounts of moral standing, and increasingly on the political economy of AI.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Artificial Religion: On AI, Myth, and Power (MIT Press, 2026)", "u": null}, {"t": "AI Ethics (MIT Press, 2020)", "u": null}, {"t": "Robot Ethics (MIT Press)", "u": null}], "est": null, "hist": null, "fut": null, "news": [{"d": "2026", "t": "Technofascism: AI, Big Tech, and the new authoritarianism — AI & Society.", "u": "https://coeckelbergh.net"}, {"d": "2026", "t": "Artificial Religion published by MIT Press.", "u": "https://coeckelbergh.net"}], "snip": "Robot and AI ethics, the politics of technology, and relational moral standing.", "zr": "The nearest working philosopher of AI to Ljubljana, and one who sat on the expert group behind the EU AI Act. Directly useful if ZAG needs to reason about where automated assessment sits in that regulation.", "sc": 3, "ct": [null, null], "era": "Contemporary", "life": "b. 1975", "ox": 0.0, "oy": 14.4, "cc": "AT"}, {"id": "ph-dignum", "n": "Virginia Dignum", "city": "Umeå", "cn": "Sweden", "iso": "se", "x": 497.4, "y": 192.4, "L": "thinker", "ll": "Professor of Responsible AI, Umeå University", "dom": ["phil"], "url": "https://aipolicylab.se", "host": "aipolicylab.se", "mono": "VD", "meta": [["Lifespan", "b. 1964"], ["Era", "Contemporary"], ["Based", "Umeå, Sweden"]], "sec": [], "b": "Leads the AI Policy Lab at Umeå and is the most institutionally connected figure in European AI governance: member of the UN High-Level Advisory Body on AI, the EU High-Level Expert Group, UNESCO's implementation group and the OECD expert group, founder of the Dutch AI Alliance, and co-chair of the ACM Technology Policy Council.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "The AI Paradox: How to Make Sense of a Complex Future (Princeton UP, 2026)", "u": null}, {"t": "Responsible Artificial Intelligence (Springer, 2019)", "u": null}], "est": null, "hist": null, "fut": null, "news": [{"d": "2026", "t": "The AI Paradox published by Princeton University Press.", "u": "https://aipolicylab.se"}], "snip": "Responsible AI, value-sensitive design, and translating ethics into governance instruments.", "zr": "If ZAG needs a defensible governance framework for AI used in conformity assessment, her work is the practical bridge between principle and procedure. Also an ELLIS fellow, which makes her reachable through the Slovenian unit.", "sc": 3, "ct": [null, null], "era": "Contemporary", "life": "b. 1964", "ox": 0, "oy": 0, "cc": "SE"}, {"id": "ph-clark", "n": "Andy Clark", "city": "Brighton", "cn": "United Kingdom", "iso": "gb", "x": 253.7, "y": 479.5, "L": "thinker", "ll": "Professor of Cognitive Philosophy, Sussex", "dom": ["phil"], "url": "", "host": "", "mono": "AC", "meta": [["Lifespan", "b. 1957"], ["Era", "Contemporary"], ["Based", "Brighton, United Kingdom"]], "sec": [], "b": "Co-author with David Chalmers of the extended mind thesis: cognitive processes can extend into the environment, so a notebook or an instrument can be part of the thinking, not merely an aid to it. Latterly the leading philosophical exponent of predictive processing.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "The Extended Mind (1998, with David Chalmers)", "u": null}, {"t": "Surfing Uncertainty (2016)", "u": null}, {"t": "The Experience Machine (2023)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Extended and embodied cognition, and prediction-error minimisation as a theory of mind.", "zr": "Predictive processing is, formally, the same idea as a monitoring system that models expected structural response and treats deviation as information. The philosophical literature on it is a useful source of framing for what an anomaly actually means.", "sc": 3, "ct": [null, null], "era": "Contemporary", "life": "b. 1957", "ox": 0.0, "oy": 14.4, "cc": "UK"}, {"id": "ph-floridi", "n": "Luciano Floridi", "city": "Bologna", "cn": "Italy", "iso": "it", "x": 417.3, "y": 631.1, "L": "thinker", "ll": "Founding Director, Digital Ethics Center, Yale; part-time Bologna", "dom": ["phil"], "url": "", "host": "", "mono": "LF", "meta": [["Lifespan", "b. 1964"], ["Era", "Contemporary"], ["Based", "Bologna, Italy"]], "sec": [], "b": "Founded the philosophy of information as a field. Now at Yale, where he directs the Digital Ethics Center, while retaining a part-time is a good corrective when assessing vendor claims about what AI will be able to do for infrastructure in five years.", "sc": 3, "ct": [null, null], "era": "Contemporary", "life": "b. 1968", "ox": 0.0, "oy": 14.4, "cc": "DE"}, {"id": "ph-bostrom", "n": "Nick Bostrom", "city": "Oxford", "cn": "United Kingdom", "iso": "gb", "x": 240.4, "y": 457.2, "L": "thinker", "ll": "Philosopher; formerly Future of Humanity Institute", "dom": ["phil"], "url": "", "host": "", "mono": "NB", "meta": [["Lifespan", "b. 1973"], ["Era", "Contemporary"], ["Based", "Oxford, United Kingdom"]], "sec": [], "b": "Set the terms of the existential-risk debate with Superintelligence. The Future of Humanity Institute he founded at Oxford closed in April 2024; he continues independently. His instrumental convergence and orthogonality arguments remain the standard reference points, contested as they are.", "maj": [], "sid": [], "rank": 0, "people": [], "papers": [{"t": "Superintelligence: Paths, Dangers, Strategies (2014)", "u": null}, {"t": "Deep Utopia (2024)", "u": null}], "est": null, "hist": null, "fut": null, "news": [], "snip": "Long-run AI risk, and the structure of arguments about goals and capability.", "zr": "Peripheral to civil engineering, but worth knowing because it dominates public discussion and can crowd out the mundane risks — miscalibration, drift, over-trust — that actually threaten an infrastructure system.", "sc": 3, "ct": [null, null], "era": "Contemporary", "life": "b. 1973", "ox": 18.8, "oy": 0.0, "cc": "UK"}, {"id": "ph-bryson", "n": "Joanna Bryson", "city": "Berlin", "cn": "Germany", "iso": "de", "x": 442.0, "y": 451.3, "L": "thinker", "ll": "Professor of Ethics and Technology, Hertie School", "dom": ["phil"], "url": "", "host": "", "mono": "JB", "meta": [["Lifespan", "b. 1965"], ["Era", "Contemporary"], ["Based", "Berlin, Germany"]], "sec": [], "b": "Argues that robots should not be granted moral patiency and that treating them as persons obscures the human accountability
