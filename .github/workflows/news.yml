name: Daily news

on:
  schedule:
    - cron: "23 5 * * *"   # every day at 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  news:
    runs-on: ubuntu-latest   # standard runner: free on public repositories
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch news
        run: python tools/fetch_news.py
      - name: Check the page and the feed
        run: python tools/check_atlas.py
      - name: Publish news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --cached --quiet || git commit -m "Daily news update"
          git push
