l Applied Mathematics & AI Lab"], "sid": ["Cooperative Machine Intelligence for People-Aligned Safe Systems", "Wild, Efficient and Innovative AI; Safety- and Efficiency-aligned Learning", "Housed in Cyber Valley III, Maria-von-Linden-Strasse 8"], "rank": 1, "people": [], "papers": [], "est": "2023", "hist": "Cyber Valley was founded in 2016 as a joint science-and-industry initiative of Baden-Württemberg and the Max Planck Society. The ELLIS Institute followed on 1 July 2023 as the network's first physical institute, chaired by Bernhard Schölkopf, funded by €100m from the Hector Foundation over ten years plus €25m from the state.", "fut": "Housed in Cyber Valley III on Maria-von-Linden-Strasse. Principal investigators hold joint appointments at MPI-IS or the Tübingen AI Center, so the three bodies recruit and supervise as one.", "news": [{"d": "18 May 2026", "t": "ELLIS adds seven new units, bringing the network to 44 units across roughly 150 institutions.", "u": "https://ellis.eu"}, {"d": "3 Jul 2026", "t": "Summer poster session hosted with MPI-IS in Stuttgart as part of the ELLIS Sites ICML Fest.", "u": "https://ellis.eu"}], "snip": "ELLIS Institute Tübingen — fundamental AI research, in the Cyber Valley ecosystem.", "zr": "Fundamental methods rather than applications, but two strands matter: AutoML, which is the realistic answer for an institute with strong domain data and no full-time ML engineers, and robust machine learning, which is what keeps a deployed monitoring model honest as conditions drift.", "sc": 3, "ct": ["Maria-von-Linden-Strasse 8, 72076 Tübingen, Germany", "institute-tue.ellis.eu — Contact"], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "DE"}, {"id": "zrh", "n": "ETH AI Center", "city": "Zurich", "cn": "Switzerland", "iso": "ch", "x": 373.7, "y": 566.9, "L": "research", "ll": "Research centre", "dom": ["ai"], "url": "https://ai.ethz.ch", "host": "ai.ethz.ch", "mono": "EA", "meta": [["ELLIS", "Unit Zurich"], ["Initiative", "Swiss AI, co-led nia's national building and civil engineering institute, established by government decree on 21 April 1994 out of part of the former ZRMK Ljubljana. State-owned, independent and non-profit, with 255 staff and turnover above €17m in 2024. The research and testing division runs six departments — Materials, Building Physics, Structures, Fire Safety, Sustainable Built Environment, and Geotechnics and Infrastructure — plus a Metrology department and three notified-body services under the Construction Products Regulation. In 2024 it secured 12 ARIS research projects, the most in its history, coordinating seven of them.", "maj": ["BrAId — Improving B-WIM performance with big data and Artificial Intelligence. ARIS project J7-50096, led by Aleš Žnidarič. Replaces heuristic quality control of weigh-in-motion data with AI methods on real-world datasets, so bridge weigh-in-motion can be extended to legal enforcement", "BRIDGITISE — host of DC4 and DC7 in the EU's first industrial doctoral network on bridge integrity management, funded under Horizon Europe MSCA call HORIZON-MSCA-2022-DN-01"], "sid": ["SiWIM® bridge weigh-in-motion — developed out of the EC WAVE project and now a standalone product; stores the wide range of information that makes the AI approach possible", "3DXIM Centre — Slovenia's leading 3D X-ray imaging facility, with Avizo, Dragonfly, X-AID and PyPore3D for volumetric segmentation and morphometric analysis", "Leads the SRIP for Smart Buildings and Home with the Wood Chain", "Over 50 EU-funded projects across FP4–Horizon"], "rank": 0, "people": ["Doc. dr. Aleš Žnidarič — Director of ZAG; bridge weigh-in-motion, BrAId project leader and BRIDGITISE DC4 supervisor", "Dr Andrej Anžlin — Head of the Section for Bridges and other Civil Engineering Structures; BRIDGITISE DC4 supervisor", "Dr Stanislav Lenart — BRIDGITISE DC7 supervisor", "Dr Lucia Mancini — 3DXIM X-ray imaging centre", "Dr Lidija Korat Bensa — 3DXIM X-ray imaging centre"], "papers": [], "est": "1994", "hist": "Established by government decree on 21 April 1994 out of part of ZRMK Ljubljana, the former Institute for Testing and Research in Materials and Structures, and entered on the official list of companies on 17 March 1995. State-owned, independent and non-profit, it meets the requirements for approval bodies testing and attesting conformity of construction products. Over the past decade it has taken part in more than fifty EU-funded projects.", "fut": "2024 was its strongest research year: 12 ARIS projects, seven of them coordinated, the highest in its history. BrAId is the AI-facing one — applying machine learning to the SiWIM bridge weigh-in-motion archive so that B-WIM results become accurate enough for legal enforcement, not just monitoring.", "news": [{"d": "2024", "t": "Secures 12 ARIS research projects, coordinating seven — the most in the institute's history.", "u": "https://www.zag.si/en/"}, {"d": "2024", "t": "BrAId (J7-50096) begins under Aleš Žnidarič: big data and AI for bridge weigh-in-motion quality control.", "u": "https://www.zag.si/en/"}, {"d": "2024", "t": "Annual turnover passes €17m with 255 staff across six research and testing departments.", "u": "https://www.zag.si/en/"}, {"d": "21–22 Jan 2026", "t": "Hosts two BRIDGITISE workshops in Ljubljana, on collaborative pathways in digitalised infrastructure monitoring and on the progress of digital transformation in bridge integrity management.", "u": "https://www.zag.si/en/"}, {"d": "2026", "t": "The 3DXIM X-ray imaging centre is listed as an EXCITE2 research facility.", "u": "https://www.zag.si/en/"}], "snip": "ZAG — Zavod za gradbeništvo Slovenije, the national building and civil engineering institute.", "zr": "The starting point. BrAId is the AI-facing project, but the same methods reach further than bridges: 3DXIM tomography needs volumetric segmentation, fire safety and building physics need surrogate models for expensive simulations, and the notified-body role needs AI whose outputs ers": [{"t": "A Digital Twin of Bridges for Structural Health Monitoring — interdisciplinary work with statisticians at the Alan Turing Institute, using two monitored railway bridges in Staffordshire as the case study. International Workshop on Structural Health Monitoring", "u": null}], "est": "2011", "hist": "An EPSRC, Innovate UK and industry-funded Innovation and Knowledge Centre in Cambridge's Civil Engineering Division, hosted in the UKCRIC-funded National Research Facility for Infrastructure Sensing. Deployments include Crossrail, London Bridge Station and reused piles.", "fut": "Director Brian Sheil is pushing physics-informed AI for underground infrastructure. The centre works deliberately at the level of industry standards rather than journals alone.", "news": [{"d": "2025", "t": "Director Brian Sheil keynotes Mott MacDonald's Geotechnics Forum on physics-informed AI for underground infrastructure.", "u": "https://www-smartinfrastructure.eng.cam.ac.uk"}, {"d": "2026", "t": "CSIC joins the new Smart Construction Network.", "u": "https://www-smartinfrastructure.eng.cam.ac.uk"}], "snip": "Cambridge Centre for Smart Infrastructure and Construction — sensing and data for whole-life asset management.", "zr": "The closest existing precedent to BrAId: a digital twin of monitored bridges built with statisticians from the Alan Turing Institute, validated on two railway bridges in Staffordshire. The centre is also deliberately oriented at moving methods into industry standards, which is the part most academic groups skip and a notified body cannot.", "sc": 5, "ct": ["Civil Engineering Division, Department of Engineering, University of Cambridge", "www-smartinfrastructure.eng.cam.ac.uk — Who we are"], "era": null, "life": null, "ox": 0.0, "oy": 14.4, "cc": "UK"}, {"id": "epfl-imos", "n": "EPFL — Intelligent Maintenance and Operations Systems", "city": "Lausanne", "cn": "Switzerland", "iso": "ch", "x": 342.8, "y": 585.0, "L": "research", "ll": "Research centre", "dom": ["civil", "industrial", "ai"], "url": "https://www.epfl.ch", "host": "epfl.ch", "mono": "EI", "meta": [["Papers verified", "One — the 2026 roadmap co-authorship"]], "sec": ["Predictive maintenance", "Fault diagnostics", "Transfer learning"], "b": "Works on AI for the maintenance and operation of complex engineered systems — infrastructure, transport and industrial assets — with an emphasis on transferring models between assets where labelled fault data is scarce. Sits at the point where the civil-infrastructure and industrial-engineering domains actually meet.", "maj": ["Predictive maintenance and fault diagnostics for infrastructure and industrial assets", "Domain adaptation and transfer learning where labelled fault data is scarce"], "sid": [], "rank": 0, "people": ["Prof. Olga Fink — intelligent maintenance and operations systems", "Vinay Sharma — researcher"], "papers": [{"t": "Lee J., Su H., Macchi M., Polenghi A., … Fink O., Sharma V., et al. — 2026 Roadmap on Artificial Intelligence and Machine Learning for Smart Manufacturing. arXiv:2605.00839 (multi-institution roadmap)", "u": "https://arxiv.org/abs/2605.00839"}], "est": "2018", "hist": "Led by Olga Fink. Works on predictive maintenance, fault diagnostics and the transfer of models between assets where labelled fault data is scarce — the point where civil infrastructure and industrial engineering problems converge.", "fut": "Domain adaptation and transfer learning remain the core methodological bet.", "news": [{"d": "2026", "t": "Co-authors the international Roadmap on Artificial Intelligence and Machine Learning for Smart Manufacturing.", "u": "https://arxiv.org/abs/2605.00839"}], "snip": "Intelligent Maintenance and Operations Systems, EPFL — AI for complex engineered assets.", "zr": "Predictive maintenance and fault diagnostics where labelled failure data is scarce — the defining statistical problem in bridge monitoring. Transfer and domain adaptation are exactly what lets a model trained on one instrumented bridge say anything useful about an uninstrumented one.", "sc": 4, "ct": [null, null], "era": null, "life": null, "ox": 14.4, "oy": 8.3, "cc": "CH"}, {"id": "wzl", "n": "RWTH Aachen — Laboratory for Machine Tools and Production Engineering (WZL)", "city": "Aachen", "cn": "Germany", "iso": "de", "x": 340.1, "y": 489.6, "L": "research", "ll": "Research centre", "dom": ["industrial", "ai"], "url": "https://www.wzl.rwth-aachen.de", "host": "wzl.rwth-aachen.de", "mono": "WZL", "meta": [["Projects verified", "Yes — WZL announcements, 2026"]], "sec": ["Generative AI in production", "Metrology", "Robotic assembly", "Quality systems"], "b": "Germany's largest production-engineering laboratory and the most active European group on getting generative and agentic AI into real factory settings, through its Chair of Information, Quality and Sensor Systems in Production.", "maj": ["Skipro — software methods for trustworthy generative AI in production; operational phase began July 2026. Consortium: WZL-IQS, PTB, BAM, Forschungszentrum Jülich, eurogard, INC Innovation Center, Peak Solution, NuCOS and Siemens, with Johnson Electric Aachen and Miltenyi Biotec validating. Goal is to make heterogeneous production data usable by generative AI while preserving process context and traceability", "AKIMI — agent-based AI for robotic assembly, aimed at small and medium-sized businesses"], "sid": ["Athenyx Robotics — RWTH spin-off developing physical AI for industrial component manufacturing"], "rank": 0, "people": ["Prof. Robert H. Schmitt — Chair of Information, Quality and Sensor Systems in Production (WZL-IQS)", "Prof. Christian Brecher — machine tools and production systems"], "papers": [], "est": "1906", "hist": "Germany's largest production-engineering laboratory. Its Chair of Information, Quality and Sensor Systems in Production, under Robert H. Schmitt, is the most active European group on getting generative and agentic AI into real factory settings.", "fut": "Skipro is the flagship: making heterogeneous production data usable by generative AI while preserving process context, traceability and industrial reliability requirements.", "news": [{"d": "7 Jul 2026", "t": "Skipro enters its operational phase — consortium with PTB, BAM, Forschungszentrum Jülich, Siemens and others.", "u": "https://www.wzl.rwth-aachen.de"}, {"d": "2026", "t": "AKIMI brings agent-based AI to robotic assembly for small and medium-sized businesses.", "u": "https://www.wzl.rwth-aachen.de"}, {"d": "2026", "t": "RWTH spin-off Athenyx Robotics develops physical AI for industrial component manufacturing.", "u": "https://www.wzl.rwth-aachen.de"}], "snip": "WZL — Laboratory for Machine Tools and Production Engineering, RWTH Aachen University.", "zr": "Skipro is about making heterogeneous production data usable by generative AI while preserving process context and traceability. That requirement — an AI output that can be traced back and defended — is precisely what conformity assessment demands, and the metrology framing is close to ZAG's own.", "sc": 4, "ct": ["Campus-Boulevard 30, 52074 Aachen, Germany", "www.wzl.rwth-aachen.de — Contact"], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "DE"}, {"id": "ipa", "n": "Fraunhofer Institute for Manufacturing Engineering and Automation (IPA)", "city": "Stuttgart", "cn": "Germany", "iso": "de", "x": 382.4, "y": 536.6, "L": "research", "ll": "Research centre", "dom": ["industrial", "ai"], "url": "https://www.ipa.fraunhofer.de/en", "host": "ipa.fraunhofer.de", "mono": "IPA", "meta": [["Note", "Programme-level description; papers not individually verified"]], "sec": ["Production technology", "Logistics", "Automation", "Machine vision"], "b": "One of the largest Fraunhofer institutes, working on AI fundamentals and applications for production technology, logistics and automation, usually in direct contract research with industry rather than as pure academic work.", "maj": ["AI for process monitoring, quality prediction and process-parameter optimisation", "Machine vision and sensor fusion for production lines"], "sid": ["Robotics and automation for SMEs"], "rank": 0, "people": ["Roughly 380 researchers across 17 departments"], "papers": [], "est": "1959", "hist": "One of the largest Fraunhofer institutes, roughly 380 researchers across 17 departments, working mostly in direct contract research with industry.", "fut": "AI fundamentals and applications for production technology, logistics and automation, including process monitoring, quality prediction and machine vision.", "news": [], "snip": "Fraunhofer IPA — manufacturing engineering and automation, Stuttgart.", "zr": "Machine vision, sensor fusion and process monitoring in production. Relevant to automated visual inspection and to the image-processing pipeline behind 3DXIM.", "sc": 3, "ct": ["Nobelstraße 12, 70569 Stuttgart, Germany", "www.ipa.fraunhofer.de/en — Contact"], "era": null, "life": null, "ox": 0.0, "oy": 14.4, "cc": "DE"}, {"id": "iais", "n": "Fraunhofer IAIS · Lamarr Institute", "city": "Sankt Augustin / Dortmund", "cn": "Germany", "iso": "de", "x": 355.9, "y": 490.4, "L": "research", "ll": "Research centre", "dom": ["industrial", "ai"], "url": "https://www.iais.fraunhofer.de/en.html", "host": "iais.fraunhofer.de", "mono": "FI", "meta": [["Networks", "Fraunhofer Big Data and AI Alliance, Lamarr, KI.NRW"]], "sec": ["Generative AI", "Agentic AI", "Hybrid AI", "Sovereign models"], "b": "Fraunhofer's intelligent-analysis institute, leading the KI.NRW regional AI platform and supporting the Lamarr Institute for Machine Learning and Artificial Intelligence. As of 2026 its work spans generative AI, agentic AI including edge and sovereign agent systems, and hybrid AI combining methods. An associated partner in the JAIF AI Factory consortium.", "maj": ["OpenGPT-X — the European multilingual language model Teuken 7B", "Enterprise MLOps and reliable agent evaluation"], "sid": ["KI.NRW regional AI competence platform"], "rank": 0, "people": ["Joint appointments with the universities of Bonn and Siegen"], "papers": [], "est": "2006", "hist": "Leads the KI.NRW regional AI competence platform and supports the Lamarr Institute, with joint appointments at the universities of Bonn and Siegen.", "fut": "As of 2026 the agenda covers generative AI, agentic AI including edge and sovereign agent systems, and hybrid AI combining methods.", "news": [{"d": "2026", "t": "OpenGPT-X delivers Teuken 7B, a European multilingual language model.", "u": "https://www.iais.fraunhofer.de/en.html"}, {"d": "12 Mar 2025", "t": "Named a partner in the JAIF factory consortium at Jülich.", "u": "https://eurohpc-ju.europa.eu/eurohpc-ju-selects-additional-ai-factories-strengthen-europes-ai-leadership-2025-03-12_en"}], "snip": "Fraunhofer IAIS — intelligent analysis and information systems.", "zr": "Sovereign and hybrid AI, and the OpenGPT-X models. The practical application for ZAG is document processing over its own standards, test reports and historical archive — a large, valuable and entirely untapped text corpus.", "sc": 3, "ct": ["Schloss Birlinghoven, 53757 Sankt Augustin, Germany", "www.iais.fraunhofer.de — Contact"], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "DE"}, {"id": "polimi-dig", "n": "Politecnico di Milano — Management, Economics and Industrial Engineering", "city": "Milan", "cn": "Italy", "iso": "it", "x": 383.6, "y": 609.3, "L": "research", "ll": "Research centre", "dom": ["industrial", "ai"], "url": "https://www.som.polimi.it", "host": "som.polimi.it", "mono": "PM", "meta": [["Papers verified", "One — the 2026 roadmap co-authorship"]], "sec": ["Asset management", "Maintenance", "Smart manufacturing"], "b": "Italy's main academic group on industrial asset management and maintenance engineering, and a contributor to the international agenda-setting work on AI and machine learning for smart manufacturing.", "maj": ["Asset management and maintenance decision-making under uncertainty", "Data quality for industrial AI"], "sid": [], "rank": 0, "people": ["Prof. Marco Macchi — industrial asset and maintenance management", "Dr Adalberto Polenghi — maintenance engineering and data quality"], "papers": [{"t": "Lee J., Su H., Macchi M., Polenghi A., et al. — 2026 Roadmap on Artificial Intelligence and Machine Learning for Smart Manufacturing. arXiv:2605.00839", "u": "https://arxiv.org/abs/2605.00839"}], "est": "1863", "hist": "Italy's main academic group on industrial asset management and maintenance engineering.", "fut": "Contributing to the international agenda on AI and machine learning for smart manufacturing.", "news": [{"d": "2026", "t": "Co-authors the international Roadmap on Artificial Intelligence and Machine Learning for Smart Manufacturing.", "u": "https://arxiv.org/abs/2605.00839"}], "snip": "Department of Management, Economics and Industrial Engineering, Politecnico di Milano.", "zr": "Asset management and maintenance decision-making under uncertainty, plus explicit work on data quality for industrial AI. Data quality is the whole of BrAId's problem statement, restated in an industrial vocabulary.", "sc": 4, "ct": ["Via Lambruschini 4/B, 20156 Milano, Italy", "www.som.polimi.it — Contacts"], "era": null, "life": null, "ox": 0.0, "oy": -14.4, "cc": "IT"}, {"id": "bam", "n": "Federal Institute for Materials Research and Testing (BAM)", "city": "Berlin", "cn": "Germany", "iso": "de", "x": 440.8, "y": 453.2, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge", "industrial", "ai"], "url": "https://www.bam.de/Navigation/EN/Home/home.html", "host": "bam.de", "mono": "BAM", "meta": [["Divisions", "7.2 Buildings and Structures; 8.2 NDT for Civil Engineering"], ["Demonstrator", "Nibelungen Bridge, Worms"], ["Programme", "SPP 100+"], ["Papers verified", "Yes — NDT conference records"]], "sec": ["Structural health monitoring", "Non-destructive testing", "Bridges", "Standards"], "b": "Germany's federal materials research and testing institute, and the closest institutional analogue to ZAG at federal scale — a testing, standards and research body rather than a university department. Two of its divisions matter here: Division 7.2, Buildings and Structures, which runs the structural health monitoring work, and Division 8.2, Non-destructive Testing Methods for Civil Engineering, whose stated aim is to raise the quality and effectiveness of NDT through automation and digitalisation.", "maj": ["Nibelungen Bridge, Worms — the national demonstration structure for advanced NDT and SHM. BAM has turned it into a living lab: seven triaxial accelerometers, digital smart sensors with on-board pre-processing and edge computing, reconfigurable in real time to suit the needs of AI classification models. Part of the SPP 100+ focus-area programme, and used specifically to study transfer learning of structural dynamics on a real structure", "openLAB research bridge — a purpose-built research structure whose monitoring datasets are published openly, addressing the field's central shortage: validation data from structures in a known damaged state, which cannot be obtained by deliberately damaging a bridge in service"], "sid": ["Guideline for the strategic application of monitoring of road bridges in Germany — the normative output that turns monitoring research into practice", "Division 8.2 — NDT to locate reinforcement, ducts and post-tensioning, verify as-built plans, and provide continuous monitoring, with method validation under quality management", "Distributed fibre-optic sensing in bridge monitoring, drawing on real German deployments", "Skipro consortium partner — trustworthy generative AI over heterogeneous production data"], "rank": 0, "people": ["Dr Matthias Baeßler — Division 7.2, Buildings and Structures; monitoring guidelines for German road bridges", "Dr Ralf Herrmann — Division 7.2; the Nibelungen Bridge living lab and transfer learning of structural dynamics"], "papers": [{"t": "Herrmann R. et al. — A living lab for Structural Health Monitoring at the Nibelungen Bridge Worms for transfer learning of structural dynamics", "u": null}, {"t": "Baeßler M. et al. — Guideline for the strategic application of monitoring of road bridges in Germany", "u": null}, {"t": "Monitoring data of the openLAB research bridge, Part 1: reference condition — an open dataset built to supply the damaged-state validation data the field lacks", "u": null}], "est": "1871", "hist": "A federal higher authority under the Federal Ministry for Economic Affairs, tracing its origins to the mechanical-technical testing institute founded in Berlin in 1871. Like ZAG it holds a statutory testing and standards role alongside its research.", "fut": "The Nibelungen Bridge living lab is the direction of travel: instrumented in-service structures that can be reconfigured to test AI methods, rather than laboratory specimens. BAM and BASt are both working on that same bridge from different angles.", "news": [{"d": "2025", "t": "Presents the Nibelungen Bridge living lab for transfer learning of structural dynamics, with reconfigurable edge-computing sensors.", "u": "https://www.wzl.rwth-aachen.de"}, {"d": "2025", "t": "Publishes reference-condition monitoring data from the openLAB research bridge as an open dataset.", "u": "https://www.bam.de/Navigation/EN/Home/home.html"}, {"d": "2026", "t": "Joins the Skipro consortium on trustworthy generative AI for production data.", "u": "https://www.bam.de/Navigation/EN/Home/home.html"}], "snip": "BAM — the German federal institute for materials research and testing, Berlin.", "zr": "The single most useful precedent on this map for what ZAG could build. The Nibelungen Bridge living lab solves the problem BrAId will hit next: you cannot get labelled damage data from a bridge in service, so BAM instrumented a real structure with reconfigurable sensors and published open datasets instead — and is explicitly using it for transfer learning. Same federal testing-institute status as ZAG, same normative obligations, and it has already written the German guideline on strategic monitoring of road bridges. If ZAG wants one bilateral partner with matching legal character, this is it.", "sc": 5, "ct": ["Unter den Eichen 87, 12205 Berlin, Germany", "www.bam.de — Division 7.2 Buildings and Structures"], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "DE"}, {"id": "ugev", "n": "Université Gustave Eiffel — MAST, Materials and Structures", "city": "Marne-la-Vallée", "cn": "France", "iso": "fr", "x": 286.7, "y": 528.9, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge", "ai"], "url": "https://www.univ-gustave-eiffel.fr/en/", "host": "univ-gustave-eiffel.fr", "mono": "UG", "meta": [["Formed", "2020, from IFSTTAR and five partner institutions"], ["Department", "MAST — seven laboratories, Marne-la-Vallée and Nantes"], ["Key facilities", "600 m² strong floor; 24,000 kN cable fatigue bench; pavement fatigue carousel"], ["Facts verified", "Yes — MAST and laboratory pages, 2026"]], "sec": ["Transport infrastructure", "Structures", "Digital twins", "Fatigue testing"], "b": "France's national university for the city and for transport, created in 2020 by merging IFSTTAR with Université Paris-Est Marne-la-Vallée, the École d'Architecture Marne-la-Vallée, EIVP, ENSG and ESIEE Paris. Its Materials and Structures department, MAST, gathers seven laboratories across the Marne-la-Vallée and Nantes campuses and carries the national role for road and bridge research that ZAG holds in Slovenia — including formal expert support to public policy on bridges and linear infrastructure.", "maj": ["LAMES — the reference laboratory for infrastructure durability, from design through to asset management. Its current direction is digital twins, infrastructure BIM and big-data exploitation for intelligent, predictive asset management, backed by the FABAC machines and the pavement fatigue carousel that compress years of traffic into months", "SMC, Metallic and Cable Structures — formerly a division of LCPC, the Central Laboratory for Bridges and Highways. It is involved in most ongoing expert assessments of major French structures, frequently with CEREMA, and its expertise is formally recognised by the Ministry of Ecological Transition's scientific and technical network"], "sid": ["Structural test platform at Marne-la-Vallée: a 600 m² strong floor with reaction walls", "Cable fatigue test bench rated to 24,000 kN — among the most capable in Europe for stay cables and post-tensioning", "EMGCU, experimentation and modelling for civil and urban engineering; CPDM on materials durability; GPEM on aggregates; MCD, a joint unit with CEREMA on materials for sustainable construction", "Research themes on constructive innovation for transport, energy and urban infrastructure, coordinated by Laurent Gaillet and Pierre Hornych"], "rank": 0, "people": ["Laurent Gaillet — coordinator, constructive innovations in transport, energy and urban infrastructure", "Pierre Hornych — coordinator, roads and innovative platforms"], "papers": [], "est": "2020", "hist": "The lineage runs through IFSTTAR back to LCPC, the Central Laboratory for Bridges and Highways, which makes MAST the direct descendant of the French national bridge laboratory. LAMES alone reflects more than thirty years of accumulated test facilities.", "fut": "LAMES has moved explicitly toward digital twins and predictive asset management, which is the same destination BrAId is heading for from the measurement end.", "news": [], "snip": "MAST — materials and structures research at Université Gustave Eiffel, successor to IFSTTAR and LCPC.", "zr": "The most complete national bridge research capability in Europe, and a FEHRL peer with the same public-policy support role ZAG has. Two things are directly useful: LAMES is already building the digital-twin and predictive asset-management layer that B-WIM data should eventually feed, and the 24,000 kN cable fatigue bench and 600 m² strong floor are facilities Slovenia will never build but can collaborate to access. SMC's position in French expert assessments of major structures also makes it the right partner if ZAG wants B-WIM accepted as evidence in a regulatory setting.", "sc": 4, "ct": ["MAST, Cité Descartes, Bâtiment Bienvenüe, 14–20 Boulevard Newton, Champs-sur-Marne", "mast.univ-gustave-eiffel.fr — Contact"], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "FR"}, {"id": "empa", "n": "Structural Engineering Research Laboratory (Empa Lab 303)", "city": "Dübendorf", "cn": "Switzerland", "iso": "ch", "x": 374.7, "y": 566.3, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://www.empa.ch/web/empa/structural-engineering", "host": "empa.ch", "mono": "Empa", "meta": [["Laboratory", "303, Structural Engineering"], ["Head", "Prof. Dr Masoud Motavalli"], ["Accreditation", "ISO/IEC 17025, static and fatigue"], ["Distinction", "Switzerland's only accredited large-scale testing laboratory"], ["Facts verified", "Yes — laboratory pages, 2026"]], "sec": ["Fatigue", "Strengthening", "Bridge cables", "Large-scale testing"], "b": "An interdisciplinary research institute of the ETH Domain, at Dübendorf. Its Structural Engineering Research Laboratory, headed by Prof. Masoud Motavalli, is the only accredited laboratory in Switzerland for large-scale structural testing, holding ISO/IEC 17025 for both static and fatigue tests, with a large testing hall and machines covering a wide range of specimen sizes.", "maj": ["Iron-based shape memory alloy (Fe-SMA) developed at Empa for prestressed strengthening of civil structures: an electric current heats the strips to about 160 °C, and cooling develops the prestress without jacks or anchor blocks", "Fatigue of metallic bridge components under mixed-mode loading — connections, rivet holes and weld lines in railway bridges, where real loading combines tension, bending, shear and torsion rather than the pure tension of classical fatigue tests"], "sid": ["CFRP strengthening of reinforced concrete and metallic members, with a video and photo record of bridge applications", "Bridge cable testing, and coordination of testing for post-tensioning and stay-cable systems", "Timber Engineering Group under Dr Pedro Palma — including a review of structural health monitoring methods for timber structures", "Standardisation work for SIA and the structural Eurocodes", "Organiser of the SMAR conference series on smart monitoring, assessment and rehabilitation of civil structures; the eighth edition runs 26–28 August 2026 in Dresden"], "rank": 0, "people": ["Prof. Dr Masoud Motavalli — Head of the Structural Engineering Research Laboratory", "Dr Pedro Palma — Group Leader, Timber Engineering", "Dr René Steiger — timber structures and monitoring"], "papers": [{"t": "Palma P. & Steiger R. — Structural health monitoring of timber structures: review of available methods and case studies. Empa, Dübendorf", "u": null}], "est": "1880", "hist": "Empa is the materials science and technology institute of the ETH Domain. The structural engineering laboratory has built its position on large-scale physical testing at a scale no Swiss university can match, and on strengthening technologies that extend the life of existing structures.", "fut": "Fe-SMA prestressing and CFRP strengthening are aimed at the same goal as monitoring: keeping existing bridges in service rather than replacing them. In August 2026 Empa opened two new laboratories on its Thun campus.", "news": [{"d": "26–28 Aug 2026", "t": "SMAR 2026, the 8th International Conference on Smart Monitoring, Assessment and Rehabilitation of Civil Structures, held in Dresden.", "u": "https://www.empa.ch/web/empa/structural-engineering"}, {"d": "25 Aug 2026", "t": "Two new laboratories open on the Empa Thun campus following a split of the former Advanced Materials Processing Laboratory.", "u": "https://www.empa.ch/web/empa/structural-engineering"}], "snip": "Empa Lab 303 — structural engineering testing and strengthening research, Dübendorf.", "zr": "The accreditation is the point. ZAG is a notified body; Empa is Switzerland's only accredited laboratory for large-scale structural testing and also does standardisation work for SIA and the Eurocodes. That makes it a peer in the part of the job that universities do not do — turning experiment into a defensible conformity statement. Practically: Fe-SMA and CFRP strengthening are what a bridge owner does after monitoring says the structure needs help, so Empa covers the intervention end of the same pipeline BrAId sits at the front of. SMAR 2026 in Dresden is the obvious venue to present B-WIM work.", "sc": 4, "ct": ["Überlandstrasse 129, 8600 Dübendorf, Switzerland", "www.empa.ch/web/s303 — Structural Engineering, Lab 303"], "era": null, "life": null, "ox": -14.4, "oy": 8.3, "cc": "CH"}, {"id": "ul-fgg", "n": "University of Ljubljana — Faculty of Civil and Geodetic Engineering (UL FGG)", "city": "Ljubljana", "cn": "Slovenia", "iso": "si", "x": 465.7, "y": 594.6, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://www.fgg.uni-lj.si/en/", "host": "fgg.uni-lj.si", "mono": "UL", "meta": [["Founded", "1919, as part of the Technical Faculty"], ["Structure", "8 scientific areas, 21 research units, 2 laboratories, 3 institutes"], ["Role", "SLAIF AI Factory consortium member"], ["Programmes verified", "Yes — faculty research programme listing"]], "sec": ["Structural mechanics", "Earthquake engineering", "Geodesy", "E-civil engineering"], "b": "ZAG's nearest academic partner, five kilometres away on Jamova cesta, and one of the five Slovenian universities inside the SLAIF consortium. Teaching and research run across eight scientific areas through 21 educational-research units, two laboratories and three institutes. The faculty's structural line goes back to the founding of the Technical Faculty in 1919.", "maj": ["Building Structures and Building Physics — research programme led by Prof. Jože Korelc, whose Chair for Metal Structures has spent two decades developing automatic generation of numerical models through symbolic-numeric computation. That work sits unusually close to the automatic differentiation machinery behind physics-informed machine learning", "Structural Mechanics — research programme led by Prof. Igor Planinc, covering nonlinear mechanics of composite and timber beams, structures at high temperature, nonlinear dynamics and structural reliability"], "sid": ["Earthquake Engineering — research programme led by Prof. Matjaž Dolšek", "E-civil engineering — research programme led by Prof. Žiga Turk, the digitalisation strand", "Earth observation and geoinformatics — led by Prof. Krištof Oštir; satellite and remote-sensing capability that complements ground instrumentation", "Water Science, Technology and Geotechnical Engineering — led by Prof. Matjaž Mikoš", "Chair of Construction Management — Assoc. Prof. Jana Šelih, five members, working on maintenance-phase decision-making and information support"], "rank": 0, "people": ["Prof. Dr Jože Korelc — Chair for Metal Structures; automatic generation of numerical models", "Prof. Dr Igor Planinc — Structural Mechanics programme", "Prof. Dr Matjaž Dolšek — Earthquake Engineering programme", "Prof. Dr Žiga Turk — E-civil engineering programme", "Prof. Dr Krištof Oštir — Earth observation and geoinformatics"], "papers": [], "est": "1919", "hist": "Among the first courses offered when the University of Ljubljana was founded in 1919. The Chair of Mechanics is one of the oldest units and has been active continuously since then, with long-standing cooperation with VTT in Finland and CTU Prague.", "fut": "Membership of the SLAIF consortium is the practical route by which Slovenian civil engineering reaches national AI compute; UL FGG and the Jožef Stefan Institute are the two bodies that connect ZAG to it.", "news": [{"d": "12 Mar 2025", "t": "Named in the SLAIF AI Factory consortium alongside all five Slovenian universities.", "u": "https://eurohpc-ju.europa.eu/eurohpc-ju-selects-additional-ai-factories-strengthen-europes-ai-leadership-2025-03-12_en"}], "snip": "UL FGG — civil engineering, geodesy and spatial planning at the University of Ljubljana.", "zr": "The partner ZAG can reach on foot, and the one with the most directly transferable methods. Korelc's automatic generation of numerical models — symbolic-numeric derivation of finite element formulations — is the same mathematical machinery that underlies physics-informed neural networks, which is precisely what B-WIM quality control needs. Add Planinc's structural reliability work and Oštir's Earth observation group, and the faculty covers the modelling, the uncertainty and the remote-sensing sides of BrAId without leaving Ljubljana.", "sc": 5, "ct": ["Jamova cesta 2, p.p. 3422, 1001 Ljubljana, Slovenia", "www.en.fgg.uni-lj.si — Departments and chairs"], "era": null, "life": null, "ox": 0.0, "oy": 18.8, "cc": "SI"}, {"id": "tno", "n": "Netherlands Organisation for Applied Scientific Research (TNO)", "city": "Delft", "cn": "Netherlands", "iso": "nl", "x": 318.3, "y": 460.8, "L": "research", "ll": "Research centre", "dom": ["civil", "industrial", "ai"], "url": "https://www.tno.nl/en/", "host": "tno.nl", "mono": "TNO", "meta": [["Note", "Programme-level description; papers not individually verified"]], "sec": ["Structural reliability", "Asset management", "Applied research"], "b": "The Dutch national applied research organisation, covering structural reliability and infrastructure asset management alongside industrial and digital work. A partner in the NLAIF AI Factory consortium.", "maj": ["NLAIF AI Factory consortium partner", "Structural reliability assessment and infrastructure asset management"], "sid": [], "rank": 0, "people": ["Applied research units across built environment and industry"], "papers": [], "est": "1932", "hist": "Covers structural reliability and infrastructure asset management alongside industrial and digital research.", "fut": "A named partner in the NLAIF AI Factory consortium, which gives it a direct route to national AI compute.", "news": [{"d": "10 Oct 2025", "t": "Named a partner in the NLAIF Dutch AI Factory consortium.", "u": "https://www.eurohpc-ju.europa.eu/eurohpc-ju-selects-six-additional-ai-factories-expand-europes-ai-capabilities-2025-10-10_en"}], "snip": "TNO — the Dutch national organisation for applied scientific research.", "zr": "Dutch applied research on structural reliability and infrastructure asset management, with a route into national AI compute through the NLAIF consortium. A peer organisation rather than a university department.", "sc": 4, "ct": [null, null], "era": null, "life": null, "ox": 0.0, "oy": 14.4, "cc": "NL"}, {"id": "bast", "n": "Federal Highway and Transport Research Institute (BASt)", "city": "Bergisch Gladbach", "cn": "Germany", "iso": "de", "x": 355.5, "y": 485.9, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge", "ai"], "url": "https://www.bast.de", "host": "bast.de", "mono": "BASt", "meta": [["Reports to", "Federal Ministry of Transport"], ["Renamed", "1 February 2025"], ["Networks", "FEHRL, D-A-CH"], ["Projects verified", "Yes — BASt announcements 2025–26"]], "sec": ["Bridges", "Road infrastructure", "Structural data", "Standards"], "b": "Germany's federal road research institute, under the Federal Ministry of Transport, and the single most direct institutional counterpart to ZAG in Europe. It was renamed on 1 February 2025 from Bundesanstalt für Straßenwesen to Bundesanstalt für Straßen- und Verkehrswesen, reflecting a remit that has grown well beyond roads. A core part of its work is drafting the rules and standards that govern German road engineering — the same normative role ZAG holds in Slovenia.", "maj": ["Brückenkompetenzzentrum — dedicated Bridge Competence Centre, opened August 2025, acting as the central point of contact for German bridge research", "D-A-CH joint road infrastructure research programme with Austria and Switzerland; the 2026 call ran 27 May to 23 September 2026 with a €2.1m budget, Topic 1 being AI-supported evaluation of heterogeneous structural and condition data"], "sid": ["Innovationsprogramm Straße — ten research projects on extending the remaining service life of road bridges, with the Nibelungenbrücke at Worms as a live test structure for distributed fibre-optic sensing", "AIrBSound — airborne acoustic sensing with AI analysis to detect deterioration in bridge expansion joints, trialled on the Wesenitz and Sachsen bridges at Pirna", "SIB-BAUWERKE — the national programme system holding the federal trunk road structure inventory", "Test facilities including a rotating pavement rig, a dynamic investigation hall and a vehicle crash facility"], "rank": 0, "people": [], "papers": [], "est": "1951", "hist": "A technical and scientific research institute of the federal transport ministry, based in the Frankenforst district of Bergisch Gladbach. Its work runs from answering short-term ministerial questions to coordinating multi-year research programmes, and it contributes to standards alongside FGSV, DIN and DIBt.", "fut": "Bridge condition has become politically acute in Germany after closures such as the Rahmede viaduct and the Bonn north bridge, which is what the new Bridge Competence Centre exists to address.", "news": [{"d": "1 Feb 2025", "t": "Renamed to Bundesanstalt für Straßen- und Verkehrswesen, widening its remit into transport research.", "u": "https://www.bast.de"}, {"d": "Aug 2025", "t": "Opens its own Bridge Competence Centre as the central hub for German bridge research.", "u": "https://www.bast.de"}, {"d": "Jul 2026", "t": "Presents interim results from ten projects on extending the remaining service life of road bridges.", "u": "https://www.bast.de"}, {"d": "May 2026", "t": "Opens the D-A-CH 2026 call, €2.1m, first topic being AI-supported evaluation of structural and condition data.", "u": "https://www.bast.de"}], "snip": "BASt — the German federal institute for road and transport research, at Bergisch Gladbach.", "zr": "The highest-value omission from the earlier version of this map, and the peer ZAG should be talking to first. In August 2025 BASt opened a dedicated Bridge Competence Centre as the central hub for German bridge research, and it runs the D-A-CH joint programme with Austria and Switzerland whose 2026 call has AI-supported evaluation of heterogeneous structural and condition data as its first named topic — that is BrAId's problem statement written into a funding call. It also operates SIB-BAUWERKE, the national bridge inventory, which is the German analogue of the SiWIM archive as a training corpus.", "sc": 5, "ct": ["Brüderstraße 53, 51427 Bergisch Gladbach, Germany", "www.bast.de — Kontakt"], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "DE"}, {"id": "ucd-ccir", "n": "UCD Centre for Critical Infrastructure Research", "city": "Dublin", "cn": "Ireland", "iso": "ie", "x": 180.7, "y": 410.5, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge", "ai"], "url": "https://www.ucd.ie/civileng/", "host": "ucd.ie", "mono": "UC", "meta": [["School", "Civil Engineering, UCD"], ["Citations", "≈14,000"], ["Papers verified", "Yes — indexed records, 2025"]], "sec": ["Bridge weigh-in-motion", "Drive-by monitoring", "Physics-informed ML", "Bridge loading"], "b": "The School of Civil Engineering at University College Dublin, where Eugene J. OBrien has built what is probably the world's leading academic group on bridge weigh-in-motion and drive-by bridge monitoring. Roughly 14,000 citations, and a body of work that runs from probabilistic B-WIM and moving force identification through to physics-informed neural networks applied to the same problem.", "maj": ["Bridge weigh-in-motion: probabilistic B-WIM, moving force identification, and rotation-based as well as strain-based systems", "Drive-by monitoring — inferring bridge condition from sensors on passing vehicles rather than on the structure"], "sid": ["Railway bridge scour detection combining machine learning with drive-by sensor data and a physics-informed vehicle–bridge interaction model", "Camera-based bridge safety monitoring, with partners in the UK and United States", "Digital twins of bridges characterised from measurements taken under random traffic", "Contributions to the ISWIM good-practice guide on WIM data for bridge applications"], "rank": 0, "people": ["Prof. Eugene J. OBrien — bridges, dynamics and loading; bridge weigh-in-motion", "Dr Arturo González — vehicle–bridge interaction", "Dr Daniel P. McCrum — structural monitoring and damage detection"], "papers": [{"t": "Han D., Deng L., Wang S., Zhang L., Kong X., Chen Z., OBrien E.J. — A novel PINN algorithm for a bridge weigh-in-motion system without prior knowledge of axle location. Mechanical Systems and Signal Processing 241 (2025)", "u": null}, {"t": "Ren Y., Tian J., OBrien E.J., Zhu T., Ozer E., et al. — Fleet Monitoring of Bridge Using Direct Calculation of Moving Reference Influence Line. Applied Sciences 15(22): 11960 (2025)", "u": null}, {"t": "OBrien E.J. & Matos J.C. — Railway bridge scour detection combining machine learning algorithms with drive-by sensor data and a physics-informed vehicle–bridge interaction framework (2025)", "u": null}], "est": "1854", "hist": "Bridge weigh-in-motion research at UCD goes back to the EU WAVE project era and has continued through BridgeMon and a long series of national and EU projects, in parallel with ZAG's own SiWIM development.", "fut": "The current direction is physics-informed machine learning applied to B-WIM and drive-by inspection — inferring both vehicle loads and structural condition from the same measurements.", "news": [{"d": "2025", "t": "Publishes a physics-informed neural network algorithm for B-WIM that requires no prior knowledge of axle location.", "u": "https://www.ucd.ie/civileng/"}, {"d": "2025", "t": "Fleet monitoring of bridges using direct calculation of a moving reference influence line.", "u": "https://www.ucd.ie/civileng/"}], "snip": "UCD School of Civil Engineering — bridge loading, dynamics and weigh-in-motion research.", "zr": "If ETH is the methodological partner, this is the domain partner — the other pole of bridge weigh-in-motion research alongside ZAG's own SiWIM lineage. The 2025 paper on a physics-informed neural network for B-WIM that needs no prior knowledge of axle location is, in effect, the academic version of what BrAId is attempting. The group also co-authored the ISWIM good-practice guide on using WIM data for bridge applications, which puts it in the same standards conversation ZAG operates in.", "sc": 5, "ct": ["School of Civil Engineering, UCD, Belfield, Dublin 4, Ireland", "www.ucd.ie/civileng — People"], "era": null, "life": null, "ox": 14.4, "oy": 8.3, "cc": "IE"}, {"id": "ibdim", "n": "Road and Bridge Research Institute (IBDiM)", "city": "Warsaw", "cn": "Poland", "iso": "pl", "x": 546.5, "y": 447.8, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://www.ibdim.edu.pl", "host": "ibdim.edu.pl", "mono": "IBDiM", "meta": [["Networks", "FEHRL"], ["Note", "Programme-level description; papers not individually verified"]], "sec": ["Bridges", "Roads", "Materials testing", "Standards"], "b": "Poland's national research institute for roads and bridges, and a FEHRL member. Like ZAG it combines research with testing, certification and standards work rather than sitting inside a university.", "maj": ["Bridge and road structure assessment, diagnostics and durability", "Testing, certification and technical approvals for construction products"], "sid": ["Materials and pavement research", "Contribution to Polish road and bridge standards"], "rank": 0, "people": [], "papers": [], "est": "1955", "hist": null, "fut": null, "news": [], "snip": "IBDiM — Instytut Badawczy Dróg i Mostów, the Polish road and bridge research institute.", "zr": "A direct institutional peer: same FEHRL membership, same mix of research, testing and normative work, and a comparably sized national bridge stock. The obvious partner for a Central European consortium on bridge assessment, and Poland now has two AI Factories to draw compute from.", "sc": 4, "ct": [null, null], "era": null, "life": null, "ox": 0.0, "oy": 14.4, "cc": "PL"}, {"id": "lnec", "n": "National Laboratory for Civil Engineering (LNEC)", "city": "Lisbon", "cn": "Portugal", "iso": "pt", "x": 63.5, "y": 716.7, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://www.lnec.pt/en/", "host": "lnec.pt", "mono": "LNEC", "meta": [["Networks", "ENBRI, FEHRL"], ["Note", "Programme-level description; papers not individually verified"]], "sec": ["Structures", "Hydraulics", "Geotechnics", "Materials"], "b": "Portugal's national civil engineering laboratory, founded 1946, and one of the largest state civil engineering research institutes in Europe. A member of both ENBRI and FEHRL, with a structures department covering bridge assessment, monitoring and seismic behaviour.", "maj": ["Structures department — bridge assessment, monitoring and seismic behaviour", "Testing and expert advice to Portuguese public authorities"], "sid": ["Hydraulics and environment", "Geotechnics", "Materials and concrete durability"], "rank": 0, "people": [], "papers": [], "est": "1946", "hist": null, "fut": null, "news": [], "snip": "LNEC — Laboratório Nacional de Engenharia Civil, Lisbon.", "zr": "ZAG's closest analogue in the Iberian peninsula and a fellow ENBRI member — same legal character, same combination of research, testing and advice to government. Useful as a partner for EU proposals where a spread of national laboratories is expected, and for comparing how another small-country institute has handled digitalisation.", "sc": 4, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "PT"}, {"id": "vti", "n": "Swedish National Road and Transport Research Institute (VTI)", "city": "Linköping", "cn": "Sweden", "iso": "se", "x": 461.2, "y": 318.5, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://www.vti.se/en", "host": "vti.se", "mono": "VTI", "meta": [["Networks", "FEHRL"], ["Nearby", "MIMER AI Factory and Arrhenius, same city"], ["Note", "Programme-level description; papers not individually verified"]], "sec": ["Transport infrastructure", "Pavements", "Traffic safety"], "b": "Sweden's independent national research institute for road and transport, based in Linköping — the same city as the MIMER AI Factory and the Arrhenius supercomputer.", "maj": ["Road and transport infrastructure research", "Pavement and structure condition assessment"], "sid": ["Traffic safety and driver behaviour", "Transport economics"], "rank": 0, "people": [], "papers": [], "est": "1971", "hist": null, "fut": null, "news": [], "snip": "VTI — the Swedish national road and transport research institute.", "zr": "A FEHRL peer with an unusual advantage: it sits beside a EuroHPC AI Factory and a sensitive-data compute partition. That combination — national road research institute plus adjacent AI compute — is exactly the configuration ZAG is trying to build with SLAIF, which makes VTI worth watching as a working example.", "sc": 4, "ct": [null, null], "era": null, "life": null, "ox": -14.4, "oy": 8.3, "cc": "SE"}, {"id": "trl", "n": "Transport Research Laboratory (TRL)", "city": "Wokingham", "cn": "United Kingdom", "iso": "gb", "x": 244.7, "y": 465.9, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://www.trl.co.uk", "host": "trl.co.uk", "mono": "TRL", "meta": [["Networks", "FEHRL"], ["Note", "Programme-level description; papers not individually verified"]], "sec": ["Infrastructure", "Transport", "Assessment"], "b": "The former UK government transport laboratory, privatised in 1996 and now an independent research and consultancy organisation. A FEHRL member with a long record in bridge and pavement assessment.", "maj": ["Infrastructure assessment and asset management research", "Transport safety and policy research"], "sid": ["Pavement engineering", "Connected and automated vehicle testing"], "rank": 0, "people": [], "papers": [], "est": "1933", "hist": null, "fut": null, "news": [], "snip": "TRL — the UK Transport Research Laboratory.", "zr": "Useful mainly as a contrast: a national road laboratory that was privatised, and therefore a case study in what happens to the standards-and-testing role when it leaves public ownership. Relevant background if ZAG's funding model ever comes under review.", "sc": 3, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "UK"}, {"id": "ait", "n": "AIT Austrian Institute of Technology", "city": "Vienna", "cn": "Austria", "iso": "at", "x": 491.6, "y": 543.0, "L": "research", "ll": "Research centre", "dom": ["civil", "industrial", "ai"], "url": "https://www.ait.ac.at/en", "host": "ait.ac.at", "mono": "AA", "meta": [["Role", "Drives AI:AT with Advanced Computing Austria"], ["Note", "AI:AT role verified; other programmes described at programme level"]], "sec": ["Transport infrastructure", "Digital safety", "Energy", "Vision & sensing"], "b": "Austria's largest non-university research institute, and one of the two bodies driving the AI:AT factory. Its Center for Transport Technologies works on infrastructure monitoring and assessment alongside a strong machine vision and sensing capability.", "maj": ["Center for Transport Technologies — infrastructure monitoring, assessment and digital twins", "Co-driver of the AI:AT AI Factory with Advanced Computing Austria"], "sid": ["Machine vision and sensor systems", "Digital safety and security", "Energy systems research"], "rank": 0, "people": [], "papers": [], "est": "1956", "hist": null, "fut": null, "news": [], "snip": "AIT — Austria's largest applied research institute, and a driver of the AI:AT factory.", "zr": "The nearest large applied-research institute that already combines transport infrastructure with AI, and a driver of the Austrian AI Factory. Geographically and institutionally the easiest cross-border partner for ZAG after Slovenia's own network, and a natural third party in a D-A-CH-style consortium.", "sc": 4, "ct": [null, null], "era": null, "life": null, "ox": 0.0, "oy": 14.4, "cc": "AT"}, {"id": "feup-vibest", "n": "Laboratory of Vibrations and Structural Monitoring (ViBest), FEUP", "city": "Porto", "cn": "Portugal", "iso": "pt", "x": 84.7, "y": 666.5, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://paginas.fe.up.pt/~vibest/", "host": "paginas.fe.up.pt", "mono": "LV", "meta": [["Unit", "Construct, FEUP"], ["Note", "Programme-level description; papers not individually verified"]], "sec": ["Vibration-based SHM", "Dynamic testing", "Long-span bridges"], "b": "One of Europe's longest-running groups in vibration-based structural health monitoring, within the Construct research unit at the University of Porto's Faculty of Engineering. Known for continuous dynamic monitoring of large bridges and for output-only modal identification.", "maj": ["Continuous dynamic monitoring of long-span bridges", "Output-only modal identification and automated modal tracking"], "sid": ["Dynamic testing of footbridges and stadia", "Vibration serviceability assessment"], "rank": 0, "people": [], "papers": [], "est": "1996", "hist": null, "fut": null, "news": [], "snip": "ViBest — vibration-based structural health monitoring at the University of Porto.", "zr": "Output-only modal identification is the technique that lets you characterise a bridge from ambient traffic alone, with no controlled load test — the same measurement philosophy as B-WIM, applied to dynamics rather than statics. A strong methodological complement to ZAG's static weighing work.", "sc": 4, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "PT"}, {"id": "minho-isise", "n": "Institute for Sustainability and Innovation in Structural Engineering (ISISE)", "city": "Guimarães", "cn": "Portugal", "iso": "pt", "x": 91.0, "y": 661.8, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://www.isise.net", "host": "isise.net", "mono": "ISISE", "meta": [["Institute", "ISISE"], ["Note", "The scour collaboration is verified; other work described at programme level"]], "sec": ["Bridge management", "Asset management", "Structural assessment"], "b": "The Institute for Sustainability and Innovation in Structural Engineering, where José C. Matos leads work on bridge management, life-cycle assessment and quality control of infrastructure. Also a co-author on recent machine-learning work on railway bridge scour with UCD.", "maj": ["Bridge management and life-cycle performance of transport infrastructure", "Quality control and specification frameworks for bridges"], "sid": ["Machine learning for railway bridge scour detection, with UCD", "Masonry and heritage structure assessment"], "rank": 0, "people": ["Prof. José C. Matos — bridge management and infrastructure quality control"], "papers": [], "est": "2006", "hist": null, "fut": null, "news": [], "snip": "ISISE — structural engineering research at the University of Minho.", "zr": "Bridge management systems are the layer above monitoring: how condition data turns into intervention decisions across a whole stock. That is the step BrAId's outputs eventually have to feed, and Minho has led European networks on exactly that question.", "sc": 4, "ct": [null, null], "era": null, "life": null, "ox": 0.0, "oy": 14.4, "cc": "PT"}, {"id": "polimi-dica", "n": "Politecnico di Milano — Civil and Environmental Engineering", "city": "Milan", "cn": "Italy", "iso": "it", "x": 383.7, "y": 609.4, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://www.dica.polimi.it/en/", "host": "dica.polimi.it", "mono": "PM", "meta": [["Note", "Programme-level description; papers not individually verified"]], "sec": ["Structural monitoring", "Historic structures", "Dynamic identification"], "b": "The department behind a long tradition of dynamic monitoring of Italian bridges, towers and historic structures, with particular strength in long-term automated modal tracking under environmental variation.", "maj": ["Long-term automated dynamic monitoring of bridges and towers", "Separating environmental effects from structural change in monitoring data"], "sid": ["Assessment of historic masonry structures", "Seismic vulnerability of infrastructure"], "rank": 0, "people": [], "papers": [], "est": "1863", "hist": null, "fut": null, "news": [], "snip": "DICA — civil and environmental engineering at Politecnico di Milano.", "zr": "Separating deterioration from temperature and humidity effects is the hardest problem in long-term monitoring, and this group has more continuous multi-year datasets on that question than almost anyone. Directly applicable to interpreting drift in a B-WIM archive.", "sc": 4, "ct": [null, null], "era": null, "life": null, "ox": 0.0, "oy": 14.4, "cc": "IT"}, {"id": "epfl-mcs", "n": "EPFL — Structural Maintenance and Safety Laboratory", "city": "Lausanne", "cn": "Switzerland", "iso": "ch", "x": 342.8, "y": 585.0, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://www.epfl.ch", "host": "epfl.ch", "mono": "ES", "meta": [["Note", "Programme-level description; papers not individually verified"]], "sec": ["Fatigue", "Existing structures", "Monitoring-based assessment"], "b": "Works on the examination and maintenance of existing structures rather than the design of new ones — fatigue safety of steel and concrete bridges, and the use of monitoring data to justify keeping a structure in service.", "maj": ["Fatigue safety verification of existing steel and concrete bridges", "Monitoring-based structural examination that avoids unnecessary replacement"], "sid": ["Ultra-high-performance fibre-reinforced concrete for strengthening", "Reliability-based assessment of existing structures"], "rank": 0, "people": [], "papers": [], "est": "1996", "hist": null, "fut": null, "news": [], "snip": "MCS — structural maintenance and safety research at EPFL.", "zr": "The intellectual case for monitoring at all: measured behaviour usually shows a bridge is stronger than a code check suggests, which is what allows an authority to defer replacement. That argument, made rigorously, is the strongest justification for investing in B-WIM at national scale.", "sc": 4, "ct": [null, null], "era": null, "life": null, "ox": -14.4, "oy": 8.3, "cc": "CH"}, {"id": "kul-mech", "n": "KU Leuven — Structural Mechanics Section", "city": "Leuven", "cn": "Belgium", "iso": "be", "x": 320.7, "y": 486.5, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://bwk.kuleuven.be/bwm", "host": "bwk.kuleuven.be", "mono": "KL", "meta": [["Note", "Programme-level description; papers not individually verified"]], "sec": ["Structural dynamics", "Vibration", "Model updating"], "b": "A major European group in structural dynamics, ground-borne vibration from rail traffic, and finite element model updating from measurements — distinct from the university's AI department, which sits in computer science.", "maj": ["Finite element model updating from measured structural response", "Ground-borne vibration from railway and road traffic"], "sid": ["Structural dynamics of civil structures", "Uncertainty quantification in structural models"], "rank": 0, "people": [], "papers": [], "est": "1970", "hist": null, "fut": null, "news": [], "snip": "Structural Mechanics at KU Leuven — dynamics, vibration and model updating.", "zr": "Model updating is the formal machinery for reconciling a physical model of a bridge with what the sensors actually say. It is the bridge, so to speak, between ZAG's engineering models and a data-driven approach, and it keeps the physics in the loop.", "sc": 4, "ct": [null, null], "era": null, "life": null, "ox": 0.0, "oy": -14.4, "cc": "BE"}, {"id": "aau-shm", "n": "Aalborg University — Structural Dynamics", "city": "Aalborg", "cn": "Denmark", "iso": "dk", "x": 395.5, "y": 351.8, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://www.build.aau.dk/", "host": "build.aau.dk", "mono": "AU", "meta": [["Note", "Programme-level description; papers not individually verified"]], "sec": ["Operational modal analysis", "Offshore structures", "Monitoring"], "b": "The department where much of the modern theory of operational modal analysis was developed — identifying a structure's dynamic properties from its response to ambient excitation, with no measured input.", "maj": ["Operational modal analysis of civil and offshore structures", "Uncertainty in output-only system identification"], "sid": ["Wind turbine structural monitoring", "Fatigue of offshore support structures"], "rank": 0, "people": [], "papers": [], "est": "1974", "hist": null, "fut": null, "news": [], "snip": "Structural dynamics and operational modal analysis at Aalborg University.", "zr": "Operational modal analysis is the ambient-excitation counterpart to what B-WIM does with traffic: extract structural information from loading you did not control. The Danish work is the theoretical foundation most European monitoring practice rests on.", "sc": 3, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "DK"}, {"id": "klokner", "n": "Klokner Institute, Czech Technical University", "city": "Prague", "cn": "Czechia", "iso": "cz", "x": 459.3, "y": 504.9, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://www.klok.cvut.cz/en/", "host": "klok.cvut.cz", "mono": "KI", "meta": [["Note", "Programme-level description; papers not individually verified"]], "sec": ["Structural reliability", "Testing", "Eurocodes"], "b": "CTU's institute for structural testing and reliability, with a strong record in probabilistic assessment of existing structures and in the background work behind the Eurocodes.", "maj": ["Probabilistic assessment of existing structures", "Structural testing and materials verification"], "sid": ["Background work for Eurocode reliability provisions", "Fire safety of structures"], "rank": 0, "people": [], "papers": [], "est": "1921", "hist": null, "fut": null, "news": [], "snip": "Klokner Institute — structural testing and reliability at CTU Prague.", "zr": "Reliability-based assessment is the formal language in which an AI-derived load estimate has to be expressed if it is going to enter a code check. The Klokner group works in exactly that register, and Czechia now has its own AI Factory next door in Ostrava.", "sc": 3, "ct": [null, null], "era": null, "life": null, "ox": 0, "oy": 0, "cc": "CZ"}, {"id": "zg-grad", "n": "University of Zagreb — Faculty of Civil Engineering", "city": "Zagreb", "cn": "Croatia", "iso": "hr", "x": 488.9, "y": 598.4, "L": "research", "ll": "Research centre", "dom": ["civil", "bridge"], "url": "https://www.grad.unizg.hr/en", "host": "grad.unizg.hr", "mono": "UZ", "meta": [["Note", "Programme-level description; papers not individually verified"]], "sec": ["Structures", "Earthquake engineering", "Bridges"], "b": "Croatia's principal civil engineering faculty, with a structures and bridges department that took on considerable additional work after the 2020 Zagreb and Petrinja earthquakes.", "maj": ["Bridge and structural engineering research", "Post-earthquake assessment and strengthening of existing structures"], "sid": ["Geotechnics", "Construction materials"], "rank": 0, "people": [], "papers": [], "est": "1919", "hist": null, "fut": null, "news": [], "snip": "Faculty of Civil Engineering, University of Zagreb.", "zr": "The nearest civil engineering faculty across the border, in a country with no AI Factory and no ELLIS unit. SLAIF's mandate is explicitly regional, which puts ZAG in a natural position to lead a cross-border project rather than join som
