name: Browser check

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ui:
    runs-on: ubuntu-latest   # standard runner: free on public repositories
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install headless Chromium
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Open every page in a browser
        run: python tools/ui_check.py
