name: Weekly EU projects

on:
  schedule:
    - cron: "17 3 * * 3"   # every Wednesday at 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  projects:
    runs-on: ubuntu-latest   # standard runner: free on public repositories
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Read EU-funded projects from the CORDIS open data file
        run: python tools/fetch_projects.py
      - name: Check the page and the projects
        run: python tools/check_atlas.py
      - name: Publish projects.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects.json
          git diff --cached --quiet || git commit -m "Weekly EU projects update"
          git pull --rebase -q
          git push
